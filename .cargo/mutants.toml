# Audit the guards that decide whether persisted views can be reported current.
examine_globs = ["app/shared/silver_revision.rs", "app/shared/views_manifest.rs", "app/shared/lexical_manifest.rs"]
test_package = ["mash"]
test_tool = "nextest"
# Mutated bodies can leave arguments unused; tests must judge those mutations.
cap_lints = true
additional_cargo_args = ["--locked", "--lib", "-Zcodegen-backend", "--config", 'profile.dev.package.mash.codegen-backend="cranelift"', "--config", 'profile.dev.package.mash-query.codegen-backend="cranelift"']
additional_cargo_test_args = ["-E", "test(shared::silver_revision::tests) | test(shared::views_manifest::tests) | test(shared::lexical_manifest::tests)", "--no-tests", "fail", "--test-threads", "2"]
