# Audit silver revision, timestamp provenance and common search-document guards.
# Qdrant freshness belongs to the disposable-backend certification audit.
examine_globs = ["app/silver/revision.rs", "app/silver/enrichment.rs", "app/views/qdrant.rs", "app/storage/gold_input.rs", "app/storage/search_input.rs"]
examine_re = ["app/silver/revision.rs", "Timestamps::is_current_for", "document_hit", "app/storage/gold_input.rs", "app/storage/search_input.rs"]
test_package = ["mash"]
test_tool = "nextest"
# Mutated bodies can leave arguments unused; tests must judge those mutations.
cap_lints = true
additional_cargo_args = ["--locked", "--lib", "-Zcodegen-backend", "--config", 'profile.dev.package.mash.codegen-backend="cranelift"', "--config", 'profile.dev.package.mash-query.codegen-backend="cranelift"']
additional_cargo_test_args = ["-E", "test(silver::revision::tests) | test(silver::enrichment::timestamp_tests) | test(codex_paginated) | test(views::qdrant::document_tests) | test(storage::gold_input::tests) | test(storage::search_input::tests)", "--no-tests", "fail", "--test-threads", "2"]
