[profile.default]
fail-fast = true
test-threads = "num-cpus"
status-level = "pass"
final-status-level = "fail"
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Two explicit installations and compilation of a fresh Core ML sequence shape
# take about a minute on the development MacBook, even with cached downloads.
filter = 'test(=semantic::models::generations::tests::lazy_coreml_reader_loads_new_shapes_from_a_retired_generation)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# Explicit throughput diagnostics include repeated 512-token Core ML inference.
filter = 'test(=semantic::tests::benchmark_coreml_bucketed_batches_preserve_vectors_and_measure_throughput)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# Explicit frozen-corpus inference comparisons may replay thousands of long texts.
filter = 'test(=semantic::models::benchmarks::embedding::benchmark_embedding_worker_budget)'
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
fail-fast = false
test-threads = "num-cpus"
status-level = "all"
final-status-level = "all"
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
# Explicit private-corpus transfer validates gigabytes of canonical records.
filter = 'test(=shared::qdrant_index::canonical::tests::canonical_qdrant_real_archive_roundtrip)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'test(=shared::qdrant_index::canonical::tests::canonical_qdrant_real_archive_roundtrip)'
slow-timeout = { period = "60s", terminate-after = 10 }
