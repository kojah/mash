# Kept in this repository so its workflows depend on no personal account.
name: Set up cached Rust
description: Install Rust, restore Cargo sources, and enable the shared sccache backend.

inputs:
  toolchain:
    description: Rust toolchain name or version.
    required: true
  components:
    description: Comma-separated rustup components.
    required: false
    default: ""
  targets:
    description: Comma-separated rustup targets.
    required: false
    default: ""
  cache-prefix:
    description: Repository-specific Cargo and sccache namespace.
    required: true
  mold:
    description: Install mold for Linux linking.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure compiler cache environment
      shell: bash
      run: |
        set -euo pipefail
        {
          echo 'CARGO_INCREMENTAL=0'
          echo 'CARGO_TERM_COLOR=always'
          echo 'RUSTC_WRAPPER=sccache'
          echo 'SCCACHE_GHA_ENABLED=true'
          echo 'SCCACHE_GHA_VERSION=${{ inputs.cache-prefix }}-v1'
          echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"
        } >>"$GITHUB_ENV"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache Cargo sources
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-cargo-sources-${{ hashFiles('**/Cargo.lock') }}

    - name: Configure compiler cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.16.0

    - name: Install mold
      if: inputs.mold == 'true'
      uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3
      with:
        mold-version: 2.42.0
        make-default: false
