name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated current main commit as a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger; full debug info bloats every test binary and
  # slows both compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: -Zunstable-options --jobs-frontend=4
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: mash-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Check bounded protocols and expected counterexamples
        env:
          # The runner context is only available in step-level expressions; a
          # job-level env entry makes the whole workflow invalid.
          MASH_PROTOCOL_ARTIFACTS: ${{ runner.temp }}/mash-protocol
        run: |
          make protocol-tools
          make protocol-check DEV_RUN=

  rust:
    # Cancel obsolete validation jobs on branches, without canceling an active
    # deployment. On main a run that has started finishes: with several pushes
    # an hour, canceling meant no commit was ever validated, and a release
    # needs a passing run for its exact commit. A newer push waits its turn and
    # replaces any run still waiting.
    # The reusable deploy workflow holds its own noncanceling lock and head gate.
    concurrency:
      group: mash-ci-rust-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MASH_TEST_QDRANT_URL: http://localhost:6333
      MASH_TEST_QDRANT_GRPC_URL: http://localhost:6334
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest,uv@0.12.1
          fallback: none
      - run: cargo fmt --check
      - name: Build CLI for acceptance tests
        run: cargo build --locked --bin mash --bin mash-server
      - name: Verify plugin session recall hooks
        working-directory: plugins/mash/hooks
        run: |
          uv tool run --from ruff==0.15.20 ruff check .
          uv tool run --from ruff==0.15.20 ruff format --check .
          uv tool run --from ty==0.0.38 ty check .
          MASH_RECALL_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            python3 -m unittest discover -s tests
      - name: Walk a new user's first run on a fresh home
        run: python3 .github/scripts/first-run-smoke.py target/debug/mash
      - name: Index histories while their application writes them
        run: python3 .github/scripts/live-writer-smoke.py target/debug/mash
      - name: Verify deployment gate
        run: |
          python3 .github/scripts/test-deploy-gate.py
          python3 .github/scripts/test-deploy-credentials.py
      - name: Verify development API deployment rollback
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-dev-api.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-dev-build.sh
      - name: Verify Ansible fleet policy and cross-session exclusion
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/mash-ansible-runtime
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-controller-environment.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-run-ansible.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-ansible.sh
      - name: Verify offline search evaluation and benchmark witnesses
        run: uv run --no-project python -m unittest discover -s tools -p 'test_*.py'
      - name: Install pinned sqlc release
        run: |
          mkdir -p "$RUNNER_TEMP/mash-sqlc"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz"
          printf '%s  %s\n' \
            497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354 \
            "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" -C "$RUNNER_TEMP/mash-sqlc"
          echo "$RUNNER_TEMP/mash-sqlc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mash-sqlc/sqlc" version
      - name: Verify generated SQLite queries
        run: make check-generated
      - run: cargo clippy --all-targets -- -D warnings
      - name: Verify history skill examples against Rust contracts
        env:
          MASH_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          MASH_SKILL_CARGO_RUN: run
          TMPDIR: ${{ runner.temp }}
        run: |
          if [[ "$MASH_CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]]; then
            git fetch origin "$MASH_CONTRACT_BASE" --depth=1
          fi
          bash tools/generate-history-skill.sh --check
          cargo nextest run --profile ci --locked --lib -E 'test(history_skill_)' --no-tests fail
      - run: cargo nextest run --profile ci
      - name: Configure explicit test model directory
        run: echo "MASH_TEST_MODELS_DIR=$RUNNER_TEMP/mash-test-models" >> "$GITHUB_ENV"
      - name: Restore installed test models
        id: model-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: mash-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'app/semantic.rs', 'app/semantic/models.rs', 'app/semantic/models/assets.rs', 'app/semantic/models/downloads.rs', 'app/semantic/models/install.rs', 'app/semantic/models/generations.rs') }}
      - name: Explicitly install and smoke-test local models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          printf 'version = 1\n[providers]\n' > "$RUNNER_TEMP/mash-model-install.toml"
          cargo run --locked -- --config "$RUNNER_TEMP/mash-model-install.toml" --models-dir "$MASH_TEST_MODELS_DIR" models install
      - name: Verify real embedding, reranking, hybrid search and parallel retrieval
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(cli_forwards_shared_vector_overrides) or test(mcp_protocol_forwards_vector_overrides) or test(real_models_index_and_run_hybrid_search) or test(real_models_mcp_) or test(real_models_shared_context_failure) or test(real_models_thread_discovery_and_scoped_messages) or test(real_model_length_aware_batches_preserve_quantized_vectors) or test(query_focused_reranking_preserves_paraphrases_and_reveals_late_evidence) or test(small_rerank_batches_preserve_scores_and_document_indices) or test(cached_local_models_preserve_results_and_validate_changed_assets) or test(merged_search_requests_shared_candidates_while_local_sqlite_is_blocked) or test(labeled_synthetic_relevance_matrix)'
      - run: cargo test --doc
      - name: Verify local Qdrant public interfaces and inference recovery
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(exact_mcp_search_bypasses_model_permits) or test(sdk_search_pages_continue) or test(sdk_compact_and_extended_output) or test(sdk_decision_workflow) or test(exact_core_shared_and_fallback) or test(local_candidates_use_the_shared_query_vector) or test(local_rich_filters_apply_before) or test(local_message_candidates_intersect) or test(lexical_views_rebuild_streams_mcp_progress)'
      - name: Verify local and shared Qdrant publication and retrieval
        run: cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2 -E 'test(qdrant)'
        env:
          MASH_TEST_QDRANT_URL: http://localhost:6333
          MASH_TEST_QDRANT_GRPC_URL: http://localhost:6334
      - name: Verify CLI Qdrant readiness and archives
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(status_with_completed_embeddings) or test(current_views_readiness) or test(exact_status_uses_lexical_certification) or test(status_with_completed_context_only) or test(explicit_empty_index_reports_ready) or test(export_imports_history_offline) or test(users_only_cli_index) or test(lexical_only_cli_indexes) or test(index_without_pending_embeddings) or test(incomplete_index_progress) or test(rejected_source_preserves_cli) or test(init_configures_registers_and_indexes) or test(local_destination_never_publishes)'
      - name: Verify local Qdrant search presentation and privacy
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(exact_cli_thread_excerpts) or test(cli_search_pages_partition) or test(exact_cli_search_needs_no_models) or test(exact_search_requires_every_word_and_explains_an_empty_result) or test(cli_masks_archived_credentials) or test(output_redaction_can_be_turned_off) or test(private_spans_never_reach_silver) or test(core_retrieves_native_cursor_threads)'
      - name: Verify Qdrant restart and snapshot restoration
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: |
          cargo build --locked --bin mash --bin mash-server
          MASH_TEST_SERVER_BINARY="$PWD/target/debug/mash-server" \
            cargo nextest run --profile ci --run-ignored only --no-tests fail -j 1 \
              -E 'test(shared_backend_persisted_restart_contract) or test(shared_backend_snapshot_restore_preserves_silver_views_and_revision_guards) or test(shared_views_lost_without_backup_is_replayed_from_shared_silver)'
      - name: Verify direct deployment probe and explicit refresh
        run: |
          MASH_TEST_CLI_BINARY="$PWD/target/debug/mash" \
            cargo nextest run -p mash-fleet --profile ci --run-ignored only --no-tests fail \
              -E 'test(probe_checks_without_ingestion_and_refreshes_only_when_requested)'
      - name: Clean owned restart fixtures after test failure or timeout
        if: always()
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: >-
          docker ps -aq --filter "label=mash.test.owner=$MASH_TEST_RESTART_OWNER" |
          xargs --no-run-if-empty docker rm -f -v
      - run: sccache --show-stats
      - name: Save verified installed test models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

  deploy:
    needs: [rust, protocol]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy == true
    uses: ./.github/workflows/deploy.yml
    with:
      release_requested: ${{ inputs.deploy == true }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
