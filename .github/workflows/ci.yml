name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated current main commit as a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger; full debug info bloats every test binary and
  # slows both compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTFLAGS: -Zunstable-options --jobs-frontend=4
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: mash-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Check bounded protocols and expected counterexamples
        env:
          # The runner context is only available in step-level expressions; a
          # job-level env entry makes the whole workflow invalid.
          MASH_PROTOCOL_ARTIFACTS: ${{ runner.temp }}/mash-protocol
        run: |
          make protocol-tools
          make protocol-check DEV_RUN=

  rust:
    # Cancel obsolete validation jobs, without canceling an active deployment.
    # The reusable deploy workflow holds its own noncanceling lock and head gate.
    concurrency:
      group: mash-ci-rust-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest,uv@0.12.1
          fallback: none
      - run: cargo fmt --check
      - name: Verify generated Python connector models
        # Reuse CI's LLVM artifacts; local generation defaults to Cranelift.
        run: MASH_SCHEMA_CARGO_RUN=run make check-python-models
      - name: Verify Python connector SDK and Rust decoder conformance
        run: |
          cargo build --locked --bin mash
          uv run --directory sdk/python --locked ruff check src tests examples
          uv run --directory sdk/python --locked ruff format --check src tests examples
          uv run --directory sdk/python --locked ty check src tests examples
          MASH_CONNECTOR_CONTRACT_BINARY="$GITHUB_WORKSPACE/target/debug/examples/connector-schema" \
            MASH_CONNECTOR_MASH_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            uv run --directory sdk/python --locked python -m unittest discover -s tests
      - name: Verify Obsidian ingestion and real local search
        run: |
          uv sync --project connectors/blueprints/obsidian --locked
          uv run --project connectors/blueprints/obsidian --locked ruff check connectors/blueprints/obsidian
          uv run --project connectors/blueprints/obsidian --locked ruff format --check connectors/blueprints/obsidian
          uv run --project connectors/blueprints/obsidian --locked ty check connectors/blueprints/obsidian
          MASH_CONNECTOR_MASH_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            uv run --project connectors/blueprints/obsidian --locked python -m unittest discover \
              -s connectors/blueprints/obsidian/tests
      - name: Verify Google Docs ingestion against a fake Drive and real local search
        run: |
          uv sync --project connectors/blueprints/google_docs --locked
          uv run --project connectors/blueprints/google_docs --locked ruff check connectors/blueprints/google_docs
          uv run --project connectors/blueprints/google_docs --locked ruff format --check connectors/blueprints/google_docs
          uv run --project connectors/blueprints/google_docs --locked ty check connectors/blueprints/google_docs
          MASH_CONNECTOR_MASH_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            uv run --project connectors/blueprints/google_docs --locked python -m unittest discover \
              -s connectors/blueprints/google_docs/tests
      - name: Verify GitHub ingestion against a fake API and real local search
        run: |
          uv sync --project connectors/blueprints/github --locked
          uv run --project connectors/blueprints/github --locked ruff check connectors/blueprints/github
          uv run --project connectors/blueprints/github --locked ruff format --check connectors/blueprints/github
          uv run --project connectors/blueprints/github --locked ty check connectors/blueprints/github
          MASH_CONNECTOR_MASH_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            uv run --project connectors/blueprints/github --locked python -m unittest discover \
              -s connectors/blueprints/github/tests
      - name: Verify Slack ingestion against a fake API and real local search
        run: |
          uv sync --project connectors/blueprints/slack --locked
          uv run --project connectors/blueprints/slack --locked ruff check connectors/blueprints/slack
          uv run --project connectors/blueprints/slack --locked ruff format --check connectors/blueprints/slack
          uv run --project connectors/blueprints/slack --locked ty check connectors/blueprints/slack
          MASH_CONNECTOR_MASH_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            uv run --project connectors/blueprints/slack --locked python -m unittest discover \
              -s connectors/blueprints/slack/tests
      - name: Verify Discord ingestion against a fake API and real local search
        run: |
          uv sync --project connectors/blueprints/discord --locked
          uv run --project connectors/blueprints/discord --locked ruff check connectors/blueprints/discord
          uv run --project connectors/blueprints/discord --locked ruff format --check connectors/blueprints/discord
          uv run --project connectors/blueprints/discord --locked ty check connectors/blueprints/discord
          MASH_CONNECTOR_MASH_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            uv run --project connectors/blueprints/discord --locked python -m unittest discover \
              -s connectors/blueprints/discord/tests
      - name: Verify plugin session recall hooks
        working-directory: plugins/mash/hooks
        run: |
          uv tool run --from ruff==0.15.20 ruff check .
          uv tool run --from ruff==0.15.20 ruff format --check .
          uv tool run --from ty==0.0.38 ty check .
          MASH_RECALL_TEST_BINARY="$GITHUB_WORKSPACE/target/debug/mash" \
            python3 -m unittest discover -s tests
      - name: Index histories while their application writes them
        run: python3 .github/scripts/live-writer-smoke.py target/debug/mash
      - name: Verify deployment gate
        run: |
          python3 .github/scripts/test-deploy-gate.py
          python3 .github/scripts/test-deploy-credentials.py
      - name: Verify development API deployment rollback
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-dev-api.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-dev-build.sh
      - name: Verify Ansible fleet policy and cross-session exclusion
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/mash-ansible-runtime
        run: |
          TMPDIR="$RUNNER_TEMP" bash tools/test-controller-environment.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-run-ansible.sh
          TMPDIR="$RUNNER_TEMP" bash tools/test-ansible.sh
      - name: Verify offline search evaluation
        run: python3 -m unittest discover -s tools -p 'test_search_evaluation.py'
      - name: Install pinned sqlc release
        run: |
          mkdir -p "$RUNNER_TEMP/mash-sqlc"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz"
          printf '%s  %s\n' \
            497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354 \
            "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" -C "$RUNNER_TEMP/mash-sqlc"
          echo "$RUNNER_TEMP/mash-sqlc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mash-sqlc/sqlc" version
      - name: Verify generated SQLite queries
        run: make check-generated
      - run: cargo clippy --all-targets -- -D warnings
      - name: Verify history skill examples against Rust contracts
        env:
          MASH_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          MASH_SKILL_CARGO_RUN: run
          TMPDIR: ${{ runner.temp }}
        run: |
          if [[ "$MASH_CONTRACT_BASE" != "0000000000000000000000000000000000000000" ]]; then
            git fetch origin "$MASH_CONTRACT_BASE" --depth=1
          fi
          bash tools/generate-history-skill.sh --check
          cargo nextest run --profile ci --locked --lib -E 'test(history_skill_)' --no-tests fail
      - run: cargo nextest run --profile ci
      - name: Configure explicit test model directory
        run: echo "MASH_TEST_MODELS_DIR=$RUNNER_TEMP/mash-test-models" >> "$GITHUB_ENV"
      - name: Restore installed test models
        id: model-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: mash-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'app/semantic.rs', 'app/semantic/models.rs', 'app/semantic/models/assets.rs', 'app/semantic/models/downloads.rs', 'app/semantic/models/install.rs', 'app/semantic/models/generations.rs') }}
      - name: Explicitly install and smoke-test local models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          printf 'version = 1\n[providers]\n' > "$RUNNER_TEMP/mash-model-install.toml"
          cargo run --locked -- --config "$RUNNER_TEMP/mash-model-install.toml" --models-dir "$MASH_TEST_MODELS_DIR" models install
      - name: Verify real embedding, reranking, hybrid search and parallel retrieval
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(real_models_index_and_run_hybrid_search) or test(real_models_mcp_fusion_overrides) or test(real_models_shared_context_failure) or test(real_models_thread_discovery_and_scoped_messages) or test(real_model_length_aware_batches_preserve_quantized_vectors) or test(query_focused_reranking_preserves_paraphrases_and_reveals_late_evidence) or test(small_rerank_batches_preserve_scores_and_document_indices) or test(cached_local_models_preserve_results_and_validate_changed_assets) or test(merged_search_requests_shared_candidates_while_local_sqlite_is_blocked) or test(labeled_synthetic_relevance_matrix)'
      - run: cargo test --doc
      - name: Verify shared Qdrant publication and retrieval
        run: cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2 -E 'test(qdrant)'
        env:
          MASH_TEST_QDRANT_URL: http://localhost:6333
      - name: Verify Qdrant restart and snapshot restoration
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: |
          cargo build --locked --bin mash
          MASH_TEST_SERVER_BINARY="$PWD/target/debug/mash" \
            cargo nextest run --profile ci --run-ignored only --no-tests fail -j 1 \
              -E 'test(shared_backend_persisted_restart_contract) or test(shared_backend_snapshot_restore_preserves_silver_views_and_revision_guards) or test(shared_views_lost_without_backup_is_replayed_from_shared_silver)'
      - name: Verify direct deployment probe and explicit refresh
        run: |
          MASH_TEST_SERVER_BINARY="$PWD/target/debug/mash" \
            cargo nextest run -p mash-dev --profile ci --run-ignored only --no-tests fail \
              -E 'test(probe_checks_without_ingestion_and_refreshes_only_when_requested)'
      - name: Clean owned restart fixtures after test failure or timeout
        if: always()
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: >-
          docker ps -aq --filter "label=mash.test.owner=$MASH_TEST_RESTART_OWNER" |
          xargs --no-run-if-empty docker rm -f -v
      - run: sccache --show-stats
      - name: Save verified installed test models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

  deploy:
    needs: [rust, protocol]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy == true
    uses: ./.github/workflows/deploy.yml
    with:
      release_requested: ${{ inputs.deploy == true }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
