name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Zunstable-options --jobs-frontend=4
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: mash-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  rust:
    # Cancel obsolete validation jobs, without canceling an active deployment.
    # The reusable deploy workflow holds its own noncanceling lock and head gate.
    concurrency:
      group: mash-ci-rust-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
          fallback: none
      - run: cargo fmt --check
      - name: Verify deployment gate
        run: |
          python3 .github/scripts/test-deploy-gate.py
          python3 .github/scripts/test-deploy-credentials.py
      - name: Verify topic parity comparator
        run: |
          python3 -m unittest discover -s research/topics -p 'test_stage_parity.py'
          python3 -m unittest discover -s research/topics -p 'test_tiage.py'
          python3 -m unittest discover -s research/topics -p 'test_qmsum.py'
          python3 -m unittest discover -s research/topics -p 'test_numeric_guidance.py'
          python3 -m unittest discover -s research/topics -p 'test_qmsum_validation_capture.py'
          python3 -m unittest discover -s research/topics -p 'test_chat_review.py'
          python3 -m unittest discover -s research/topics -p 'test_science_env.py'
          python3 -m unittest discover -s research/topics -p 'test_distinct_support.py'
          python3 -m unittest discover -s research/topics -p 'test_topic_quality.py'
      - name: Install pinned sqlc release
        run: |
          mkdir -p "$RUNNER_TEMP/mash-sqlc"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz"
          printf '%s  %s\n' \
            497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354 \
            "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" -C "$RUNNER_TEMP/mash-sqlc"
          echo "$RUNNER_TEMP/mash-sqlc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mash-sqlc/sqlc" version
      - name: Verify generated SQLite queries
        run: make check-generated
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      - name: Configure explicit test model directory
        run: echo "MASH_TEST_MODELS_DIR=$RUNNER_TEMP/mash-test-models" >> "$GITHUB_ENV"
      - name: Restore installed test models
        id: model-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: mash-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'app/semantic.rs', 'app/semantic/models.rs', 'app/semantic/models/assets.rs', 'app/semantic/models/downloads.rs', 'app/semantic/models/install.rs', 'app/semantic/models/generations.rs') }}
      - name: Explicitly install and smoke-test local models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          printf 'version = 1\n[providers]\n' > "$RUNNER_TEMP/mash-model-install.toml"
          cargo run --locked -- --config "$RUNNER_TEMP/mash-model-install.toml" --models-dir "$MASH_TEST_MODELS_DIR" models install
      - name: Verify real embedding, reranking, hybrid search and parallel retrieval
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(real_models_index_and_run_hybrid_search) or test(real_models_mcp_fusion_overrides) or test(real_models_shared_context_failure) or test(real_models_thread_discovery_and_scoped_messages) or test(real_model_length_aware_batches_preserve_quantized_vectors) or test(query_focused_reranking_preserves_paraphrases_and_reveals_late_evidence) or test(small_rerank_batches_preserve_scores_and_document_indices) or test(cached_local_models_preserve_results_and_validate_changed_assets) or test(merged_search_requests_shared_candidates_while_local_sqlite_is_blocked) or test(labeled_synthetic_relevance_matrix)'
      - run: cargo test --doc
      - name: Verify shared Qdrant publication and retrieval
        run: cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2 -E 'test(qdrant)'
        env:
          MASH_TEST_QDRANT_URL: http://localhost:6333
      - name: Verify persisted Qdrant data after database and API restart
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: |
          cargo build --locked --bin mash
          MASH_TEST_SERVER_BINARY="$PWD/target/debug/mash" \
            cargo nextest run --profile ci --run-ignored only --no-tests fail -j 1 \
              -E 'test(shared_backend_persisted_restart_contract)'
      - name: Clean owned restart fixtures after test failure or timeout
        if: always()
        env:
          MASH_TEST_RESTART_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}-restart
        run: >-
          docker ps -aq --filter "label=mash.test.owner=$MASH_TEST_RESTART_OWNER" |
          xargs --no-run-if-empty docker rm -f -v
      - run: sccache --show-stats
      - name: Save verified installed test models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

  deploy:
    needs: rust
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
