name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt an all-node deployment when main advances. Stale runs
  # are skipped by the serialized deployment gate instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Zunstable-options --jobs-frontend=4
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: mash-v1
  SCCACHE_BASEDIRS: ${{ github.workspace }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: mash-test
          POSTGRES_DB: mash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
          fallback: none
      - run: cargo fmt --check
      - name: Verify deployment gate
        run: python3 .github/scripts/test-deploy-gate.py
      - name: Install pinned sqlc release
        run: |
          mkdir -p "$RUNNER_TEMP/mash-sqlc"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz"
          printf '%s  %s\n' \
            497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354 \
            "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/mash-sqlc/sqlc.tar.gz" -C "$RUNNER_TEMP/mash-sqlc"
          echo "$RUNNER_TEMP/mash-sqlc" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mash-sqlc/sqlc" version
      - name: Install PostgreSQL query generator
        run: cargo install cornucopia --version 1.0.1 --locked
      - name: Verify generated database queries
        run: make check-generated
        env:
          MASH_CODEGEN_POSTGRES_URL: postgresql://postgres:mash-test@localhost:5432
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      - name: Configure explicit test model directory
        run: echo "MASH_TEST_MODELS_DIR=$RUNNER_TEMP/mash-test-models" >> "$GITHUB_ENV"
      - name: Restore installed test models
        id: model-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: mash-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'app/semantic.rs', 'app/semantic/models.rs', 'app/semantic/models/assets.rs', 'app/semantic/models/downloads.rs', 'app/semantic/models/install.rs', 'app/semantic/models/generations.rs') }}
      - name: Explicitly install and smoke-test local models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          printf 'version = 1\n[providers]\n' > "$RUNNER_TEMP/mash-model-install.toml"
          cargo run --locked -- --config "$RUNNER_TEMP/mash-model-install.toml" --models-dir "$MASH_TEST_MODELS_DIR" models install
      - name: Verify real embedding, reranking, hybrid search and parallel retrieval
        run: >-
          cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2
          -E 'test(real_models_index_and_run_hybrid_search) or test(real_models_thread_discovery_and_scoped_messages) or test(real_model_length_aware_batches_preserve_quantized_vectors) or test(query_focused_reranking_preserves_paraphrases_and_reveals_late_evidence) or test(small_rerank_batches_preserve_scores_and_document_indices) or test(cached_local_models_preserve_results_and_validate_changed_assets) or test(merged_search_requests_shared_candidates_while_local_sqlite_is_blocked)'
      - name: Verify shared PostgreSQL publication
        run: cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2 -E 'test(postgres)'
        env:
          MASH_TEST_PG_URL: postgresql://postgres:mash-test@localhost:5432/mash_test?sslmode=disable
      - name: Verify shared Redis publication
        run: cargo nextest run --profile ci --run-ignored only --no-tests fail -j 2 -E 'test(redis)'
        env:
          MASH_TEST_REDIS_URL: redis://localhost:6379/
      - run: cargo test --doc
      - run: sccache --show-stats
      - name: Save verified installed test models
        if: success() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/mash-test-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Save Cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: mash-${{ runner.os }}-cargo-sources-${{ hashFiles('Cargo.lock') }}

  deploy:
    needs: rust
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy.yml
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
