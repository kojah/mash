name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', 'README.md', 'dashboard/**', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'site/**', 'README.md', 'dashboard/**', '.github/workflows/docs.yml']
  workflow_dispatch:
  # A release adds packages to the apt repository; republish so they are served.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            site/pnpm-lock.yaml
            dashboard/pnpm-lock.yaml
      # The demo is the dashboard itself, built to answer from made-up history.
      - name: Build the dashboard demo
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo
      - name: Install and validate documentation
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          pnpm test
          pnpm build
          pnpm add-demo
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - name: Preserve published apt repository
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin gh-pages > "$RUNNER_TEMP/apt-branch"
          status=$?
          set -e
          case "$status" in
            0)
              git fetch --depth=1 origin gh-pages
              if git cat-file -e FETCH_HEAD:apt; then
                git archive FETCH_HEAD apt | tar -x -C site/dist
              else
                echo "::error::Existing gh-pages branch lacks apt; refusing to publish an incomplete artifact."
                exit 1
              fi
              ;;
            2) echo "No apt release has been published yet." ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation and apt files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
