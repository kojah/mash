name: Release

# Tagging vX.Y.Z publishes prebuilt binaries for the commit CI validated, then
# updates the Homebrew tap when HOMEBREW_TAP_TOKEN is configured. Releases
# build on stable Rust so they need no nightly features.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unvalidated:
        description: Build even though CI has not passed for this commit (artifacts only; never published)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validated:
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run for this commit
        if: ${{ !inputs.allow_unvalidated }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --limit 1 --json conclusion \
            -q '.[0].conclusion // ""')
          if [ "$conclusion" != success ]; then
            echo "::error::CI has not passed for $GITHUB_SHA; releases ship validated commits only."
            exit 1
          fi

  build:
    needs: validated
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Build
        env:
          MASH_BUILD_REVISION: ${{ github.sha }}
        run: cargo +stable build --release --locked --bin mash
      - name: Smoke
        run: .github/scripts/deploy-smoke target/release/mash "$GITHUB_SHA"
      - name: Package
        run: |
          archive="mash-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "$archive" mash
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mash-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mash-*.tar.gz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            exit 0
          fi
          python3 packaging/homebrew/render.py "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > mash.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kojah/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp mash.rb tap/Formula/mash.rb
          cd tap
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add Formula/mash.rb
          git commit -m "mash ${GITHUB_REF_NAME}"
          git push
