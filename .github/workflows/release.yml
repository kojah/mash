name: Release

# Tagging vX.Y.Z publishes prebuilt binaries for the commit CI validated, then
# updates each package channel whose credential is configured: the Homebrew
# tap (HOMEBREW_TAP_TOKEN), the Scoop bucket in this repository (always),
# winget (WINGET_TOKEN), Chocolatey (CHOCOLATEY_API_KEY), npm (NPM_TOKEN) and
# the signed apt repository on GitHub Pages (APT_GPG_PRIVATE_KEY).
# mise and cargo-binstall read the release assets directly. Releases build on
# stable Rust so they need no nightly features.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unvalidated:
        description: Build even though CI has not passed for this commit (artifacts only; never published)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  validated:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI and Windows runs for this commit
        if: ${{ !inputs.allow_unvalidated }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml windows.yml; do
            conclusion=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$GITHUB_SHA" --status success --limit 1 --json conclusion \
              -q '.[0].conclusion // ""')
            if [ "$conclusion" != success ]; then
              echo "::error::$workflow has not passed for $GITHUB_SHA; releases ship validated commits only."
              exit 1
            fi
          done

  build:
    needs: validated
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-26
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Build
        env:
          MASH_BUILD_REVISION: ${{ github.sha }}
        run: cargo +stable build --release --locked --bin mash
      - name: Smoke
        run: |
          binary=target/release/mash
          [ -f "$binary.exe" ] && binary="$binary.exe"
          .github/scripts/deploy-smoke "$binary" "$GITHUB_SHA"
      - name: Package
        run: |
          archive="mash-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd target/release && 7z a -tzip "$GITHUB_WORKSPACE/$archive" mash.exe)
          else
            tar -C target/release -czf "$archive" mash
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mash-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mash-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 7
      - name: Update the Scoop bucket
        run: |
          python3 packaging/render.py "$GITHUB_REF_NAME" dist/SHA256SUMS \
            packaging/scoop/mash.json.in bucket/mash.json
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add bucket/mash.json
          git commit -m "Scoop: mash ${GITHUB_REF_NAME}"
          git push origin HEAD:main
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping the tap update."
            exit 0
          fi
          python3 packaging/render.py "$GITHUB_REF_NAME" dist/SHA256SUMS \
            packaging/homebrew/mash.rb.in mash.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kojah/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp mash.rb tap/Formula/mash.rb
          cd tap
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add Formula/mash.rb
          git commit -m "mash ${GITHUB_REF_NAME}"
          git push

  npm:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish @kojah/mash and its platform packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping npm."
            exit 0
          fi
          python3 packaging/npm/build.py "$GITHUB_REF_NAME" dist npm
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          for package in npm/mash-*/ npm/mash/; do
            npm publish --access public "$package"
          done

  apt:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish .deb packages and the apt repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY is not set; skipping apt."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git clone --branch gh-pages --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          else
            git init -b gh-pages site
            git -C site remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            touch site/.nojekyll
          fi
          packaging/apt/build-repo.sh "$GITHUB_REF_NAME" dist site/apt
          gh release upload "$GITHUB_REF_NAME" dist/mash_*.deb --repo "$GITHUB_REPOSITORY"
          cd site
          git config user.name "mash release"
          git config user.email "mash-release@users.noreply.github.com"
          git add -A
          git commit -m "apt: mash ${GITHUB_REF_NAME}"
          git push origin gh-pages

  windows-packages:
    needs: publish
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: SHA256SUMS
          path: dist
      - name: Render manifests
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          foreach ($name in 'kojah.mash.yaml', 'kojah.mash.installer.yaml', 'kojah.mash.locale.en-US.yaml') {
            python packaging/render.py $version dist/SHA256SUMS "packaging/winget/$name.in" "winget/$name"
          }
          python packaging/render.py $version dist/SHA256SUMS packaging/chocolatey/mash.nuspec.in chocolatey/mash.nuspec
          python packaging/render.py $version dist/SHA256SUMS packaging/chocolatey/tools/chocolateyinstall.ps1.in chocolatey/tools/chocolateyinstall.ps1
      - name: Submit to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { "WINGET_TOKEN is not set; skipping winget."; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN winget
      - name: Push to Chocolatey
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if (-not $env:CHOCOLATEY_API_KEY) { "CHOCOLATEY_API_KEY is not set; skipping Chocolatey."; exit 0 }
          choco pack chocolatey/mash.nuspec --outputdirectory chocolatey
          $package = Get-ChildItem chocolatey/mash.*.nupkg | Select-Object -First 1
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
