name: Windows

# Proves the stable binary builds, starts, sets up and searches on a
# native Windows runner, and that the library and CLI tests pass there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger. Full debug info makes MSVC write a large PDB
  # per binary, which slows both compiling and linking.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The lld that ships with Rust links several times faster than link.exe.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MASH_TEST_QDRANT_URL: http://127.0.0.1:6333
      MASH_TEST_QDRANT_GRPC_URL: http://127.0.0.1:6334
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Check PowerShell installer without network or a real installation
        shell: pwsh
        run: ./tools/test-install-powershell.ps1
      - name: Check installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test-install-powershell.ps1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mash-windows-v1
          # A cold Windows build takes ~15 minutes; keep what a failing run built.
          cache-on-failure: true
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: nextest
      # A debug build shares its dependencies with the test builds below, which
      # nearly halves a cold run; release.yml builds the release binary on
      # Windows before publishing.
      - name: Build
        run: cargo +stable build --locked --bin mash --bin mash-server
      - name: Start disposable native Qdrant
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qdrant'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive = Join-Path $root 'qdrant.zip'
          Invoke-WebRequest 'https://github.com/qdrant/qdrant/releases/download/v1.20.0/qdrant-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6d13553584fd0411f00637519e293331ff0aa1fb79bd9e30db45839bb75de2be') {
            throw 'Qdrant archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $root
          $env:QDRANT__SERVICE__HOST = '127.0.0.1'
          $process = Start-Process (Join-Path $root 'qdrant.exe') -WorkingDirectory $root -PassThru -RedirectStandardOutput (Join-Path $root 'stdout.log') -RedirectStandardError (Join-Path $root 'stderr.log')
          $process.Id | Set-Content (Join-Path $root 'pid')
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            if ($process.HasExited) { throw 'Qdrant exited before readiness' }
            try {
              Invoke-RestMethod 'http://127.0.0.1:6333/readyz' -TimeoutSec 2 | Out-Null
              exit 0
            } catch { Start-Sleep -Seconds 1 }
          }
          throw 'Qdrant did not become ready'
      # The test suites run first, on a clean profile: the steps after them
      # write configuration and an index into the runner's real profile, which
      # Mash's default paths would pick up. Test processes start Mash
      # constantly, so they keep the executable in place (no relocation).
      # nextest runs each test in its own process, as on Linux: tracing caches
      # callsite interest process-wide, so tests sharing one process can drop
      # each other's captured events.
      - name: Library tests
        env:
          MASH_KEEP_EXECUTABLE: "1"
          # Linux CI runs proptest's full 256 cases. Here each SQLite-backed
          # case is several times slower on NTFS, so a smaller sample checks
          # the platform without exceeding nextest's timeout.
          PROPTEST_CASES: "32"
        run: cargo +stable nextest run --profile ci --locked --lib
      - name: CLI contract tests
        env:
          MASH_KEEP_EXECUTABLE: "1"
        run: cargo +stable nextest run --profile ci --locked --test cli_contract
      - name: Smoke
        run: .github/scripts/deploy-smoke target/debug/mash.exe "$GITHUB_SHA"
      # The runner is disposable, so its real profile stands in for a user's:
      # Windows resolves profile folders through the shell, not environment.
      - name: Init and search
        run: |
          projects="$(cygpath -u "$USERPROFILE")/.claude/projects/p"
          mkdir -p "$projects"
          printf '%s\n' '{"type":"user","sessionId":"s1","uuid":"m1","cwd":"C:/work","timestamp":"2026-10-28T09:00:00Z","message":{"role":"user","content":"windowsneedle schema"}}' \
            > "$projects/s1.jsonl"
          target/debug/mash.exe init --no-agents | tee init.json
          target/debug/mash.exe search windowsneedle --local | tee search.json
          grep -q '"chat_id":"s1"' search.json
      - name: MCP, upgrade while running, and hooks
        run: python .github/scripts/windows-smoke.py target/debug/mash.exe
      # Windows file sharing and SQLite locking differ most from Unix here.
      - name: Index histories while their application writes them
        run: python .github/scripts/live-writer-smoke.py target/debug/mash.exe
      - name: Export a Windows-recorded history
        run: python .github/scripts/portability-smoke.py export target/debug/mash.exe "$RUNNER_TEMP/portable"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-export
          path: ${{ runner.temp }}/portable
          retention-days: 3
      - name: Show disposable Qdrant state after a failure
        if: failure()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'qdrant'
          $pidFile = Join-Path $root 'pid'
          if (Test-Path $pidFile) {
            $id = [int](Get-Content $pidFile)
            $process = Get-Process -Id $id -ErrorAction SilentlyContinue
            if ($process) { "Qdrant process $id is still running." } else { "Qdrant process $id has exited." }
          } else { 'No Qdrant PID file.' }
          try {
            Invoke-RestMethod 'http://127.0.0.1:6333/readyz' -TimeoutSec 5 | Out-Null
            'Qdrant answers on 127.0.0.1:6333.'
          } catch { "Qdrant does not answer on 127.0.0.1:6333: $($_.Exception.Message)" }
          foreach ($log in 'stdout.log', 'stderr.log') {
            $path = Join-Path $root $log
            "===== $log (last 80 lines) ====="
            if (Test-Path $path) { Get-Content $path -Tail 80 } else { 'missing' }
          }
      - name: Stop disposable Qdrant
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'qdrant/pid'
          if (Test-Path $pidFile) {
            Stop-Process -Id ([int](Get-Content $pidFile)) -ErrorAction SilentlyContinue
          }

  # What Windows exported must import, search and display unchanged on Linux.
  linux-import:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: mash-windows-import-v1
          cache-on-failure: true
      - name: Build
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo +stable build --locked --bin mash --bin mash-server
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: windows-export
          path: ${{ runner.temp }}/portable
      - name: Import, search and view the Windows history
        run: python3 .github/scripts/portability-smoke.py import target/debug/mash "$RUNNER_TEMP/portable"
