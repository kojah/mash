{"claim_id":"semantic/compatible-generation-rolls-over","hash":"2b76be7b69708d4fdc09310abb9d5c7d33ae2e20fd40f8cae4552b1e79e5b4ec","representations":[{"adapter":"markdown","hash":"17a5cb0c0e4d982d5fdfa983e64261ffc87b846c0ece07f868f5a552aa8c4d82","role":"normative","scope":"block","text":"- **WHEN** the target vector generation changes without changing its query embedding space and a complete serving generation exists\n- **THEN** old vectors remain the exclusive serving set until complete target coverage commits and atomically replaces them"}]}
