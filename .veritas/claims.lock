{"kind":"veritas-claims-lock","schema":1}
{"claim_id":"cli/bare-invocation-prints-help","hash":"669e9bcbf6ee47db0881b282b65e167b778056761e3ca93b3091f722799ead2b","representations":[{"adapter":"markdown","hash":"7af46ca2095ce47e11af6865dace4bcabe4b410c91e43f8e179701fd44263e45","role":"normative","scope":"block","text":"- **WHEN** `achi` is invoked without a command\n- **THEN** it prints concise help without launching an interactive interface"}]}
{"claim_id":"cli/operational-command-surface","hash":"b780fe1f3870958eb3433d1f4e128bdd99a87024ea60ec731247d9a4a08fe07b","representations":[{"adapter":"markdown","hash":"e89e1b809ba065f696ea3b771ed6878fa91362df98d958e6de9af1666250cffc","role":"normative","scope":"block","text":"The system SHALL expose only `index`, `search`, `view`, `status`, `forget`, and\n`models install` as operational commands. Operational output SHALL be JSON."}]}
{"claim_id":"cli/removed-commands-are-rejected","hash":"28502e5b8f09e91138bb0aacb8a7b534c0efcc0e38bb26832d30d653e103710b","representations":[{"adapter":"markdown","hash":"651347302a5974f974a69d6c756d1262fcdda6945c65d9f59ad01af5294fa8e3","role":"normative","scope":"block","text":"- **WHEN** a removed command such as `export`, `doctor`, `list`, or `sources` is invoked\n- **THEN** argument parsing fails without compatibility rewriting"}]}
{"claim_id":"configuration/cli-values-have-precedence","hash":"6ced7093f2e2230976df09ebcb5e200750dc7fd8481fbdd9ad458a130e72c368","representations":[{"adapter":"markdown","hash":"6416f5d4dbac4c02b4069e58e8392e5f9a942f9f1d17d022cb8177fe5fe532d4","role":"normative","scope":"block","text":"For configurable behavior, explicit CLI values SHALL replace corresponding\nvalues from the resolved local-node entry, which SHALL replace built-in\ndefaults. Repeatable `--provider PROVIDER` SHALL restrict the run to the\ndeduplicated selected providers. `--since-days N` SHALL replace the configured\nhorizon with a positive number of days, while `--all-history` SHALL replace it\nwith no horizon. Supplying both horizon flags SHALL be a typed usage error."}]}
{"claim_id":"configuration/default-file-is-optional","hash":"59cae0380287942394129ef9b382ad1ec45a163c6d48a9698862a5f4bd739e6b","representations":[{"adapter":"markdown","hash":"04836e1ff036623597fcc7443a84eb128dbc848607669c0c664e7ee6f7adacdd","role":"normative","scope":"block","text":"Without `--config`, ACHI SHALL inspect its platform configuration path for a\nACHI JSON configuration file. Absence of that default file SHALL preserve\nbuilt-in provider roots and local-only search. `achi status` SHALL report the\nresolved configuration path and whether a file was loaded."}]}
{"claim_id":"configuration/document-version-and-fields-are-validated","hash":"adbf89c00a12a5ca6500e0927d3a7bb374fc82c5555a8eb06833bc32f492bf61","representations":[{"adapter":"markdown","hash":"a4beeaf61cbb79528691e4b750bb9ec870f4f57f3356c52a3efc0a17be320cf6","role":"normative","scope":"block","text":"A loaded configuration SHALL be a JSON object with `version` equal to `1`, an\nexplicit `local_node`, and a nonempty `nodes` array. Unknown fields,\nunsupported versions, or invalid field types SHALL fail with a typed JSON\n`configuration` error."}]}
{"claim_id":"configuration/environment-inputs-are-ignored","hash":"e1210ddf81e6b2a16030bd4002387a4ba8ecfa2e476d957358ec28d5cc507b0c","representations":[{"adapter":"markdown","hash":"9878c94659819aebc5aaadcf2c247c1aa5ef1bf057b1e286c09463244f5812b7","role":"normative","scope":"block","text":"`ACHI_CLAUDE_ROOTS`, `ACHI_CODEX_ROOTS`, `ACHI_OPENCODE_ROOTS`,\n`ACHI_COPILOT_ROOTS`, `ACHI_HERMES_ROOTS`, `ACHI_PI_ROOTS`, and\n`ACHI_SEARCH_NODES` SHALL NOT alter provider discovery or federation selection.\nConfiguration files and supported CLI flags SHALL be the only user-controlled\ninputs for those values."}]}
{"claim_id":"configuration/errors-are-stable-and-nonretryable","hash":"c647ae71dc90516c66184889731a4225d02425b9951cb5d467ab0c02ba973ab3","representations":[{"adapter":"markdown","hash":"07c12f3b6f9b3bfb1616d67319741741aa5747349bb25a2c1e0fa3ea69a12d4d","role":"normative","scope":"block","text":"A configuration failure SHALL exit with code 9 and emit JSON with\n`error.kind` equal to `configuration`, `retryable` false, and no\n`recommended_action`."}]}
{"claim_id":"configuration/explicit-file-is-required","hash":"624262dd61ebea926277cf314d967c9f9e2e7c22db4f516c5212499b8957fcb0","representations":[{"adapter":"markdown","hash":"30fbc8144bfdc30b1935d3daec101bca6d6e91400d02809111a1775db09e1ddb","role":"normative","scope":"block","text":"An explicit `--config PATH` SHALL require a readable regular file. Failure to\nread or parse it SHALL produce a typed JSON `configuration` error without\nopening a database writer, scanning providers, or starting SSH."}]}
{"claim_id":"configuration/index-horizon-is-valid","hash":"6811a1d7a951078bbf9410c14b60e7778608e71c71fb6d43d06ae61bcf5653e4","representations":[{"adapter":"markdown","hash":"dcb8b74599bbcb897c7489b47b433f222ad9c010384ff0092e475f6b0f93e327","role":"normative","scope":"block","text":"Each node MAY contain an `index` object with `since_days` set to an integer from\n1 through 36500 or `null`. Missing `index` or `since_days` SHALL resolve to 90\ndays; `null` SHALL select all history. Zero, negative, out-of-range, fractional,\nor string values SHALL fail with a typed JSON configuration error."}]}
{"claim_id":"configuration/invalid-loaded-file-fails-before-effects","hash":"940f0d72c8127dbff592bab063e19969912e25ee947735282884903e2710e1c5","representations":[{"adapter":"markdown","hash":"6df86f886883de424651228ff8e95fcc167192f528104950ce171f3566d3c609","role":"normative","scope":"block","text":"An existing default configuration file SHALL have the same validation and\npre-effect failure semantics as an explicit file. Each of the six public\ncommands SHALL resolve and validate configuration before performing command\neffects. Hidden federation request workers SHALL neither discover nor load a\nconfiguration file; explicitly combining a hidden worker flag with `--config`\nor `--local-node` SHALL be a typed usage error."}]}
{"claim_id":"configuration/local-node-is-explicit","hash":"7415a5ad5c7bdc229698b04990e7a88df8abfe596ef36ccb0aa37650ae7f5dc0","representations":[{"adapter":"markdown","hash":"bd60dadf77e14d32e0274db64a72f772592aa7ae73159d132d8ae57af22ef414","role":"normative","scope":"block","text":"The configured `local_node` SHALL exactly identify one node entry. ACHI SHALL\nNOT infer local identity from the operating-system hostname or SSH destination.\nGlobal `--local-node NAME` SHALL override the configured identity and SHALL\nrequire an exact configured node name."}]}
{"claim_id":"configuration/node-inventory-is-valid","hash":"36fc26f8723f79da5f877901292c4f9e026f1a1d53ccc3cc4370d5373abc66d7","representations":[{"adapter":"markdown","hash":"2b0485dad2b339abd16864542eff61a9340c825c4a946565fcef66860da2f774","role":"normative","scope":"block","text":"Node names SHALL be unique. SSH destinations SHALL also be unique so two\nlogical nodes cannot fan out to the same machine. Each node SHALL contain a\nbounded name and SSH destination, an explicit search-participation boolean, and\na providers object. Invalid or duplicate values SHALL fail with a typed JSON\n`configuration` error."}]}
{"claim_id":"configuration/provider-roots-are-valid","hash":"4f5bf0766867b33dda2ead554c0fefbf10233aa58675ac532c3bb7d0375908aa","representations":[{"adapter":"markdown","hash":"eb5b4b280177172e5e2fa50b92a6a3fb692a04f7cba63cea76020448748ecd75","role":"normative","scope":"block","text":"Provider keys SHALL be exactly `claude-code` or `codex`. Each present provider\nSHALL contain a nonempty array of unique absolute root paths. Unsupported\nproviders and duplicate or relative roots SHALL fail with a typed JSON\nconfiguration error."}]}
{"claim_id":"configuration/status-reports-resolved-settings","hash":"bfb988ccdc628ede4db3b231660871b3e818e8cfc9912adb78158268c7042b05","representations":[{"adapter":"markdown","hash":"36fcd2caded0e01d5c826f1f7cf1f82d43a60f79f3b471390a216f5caa8d06af","role":"normative","scope":"block","text":"`achi status` SHALL include a `configuration` object containing `path`,\n`loaded`, `local_node`, `providers`, and `index`. `providers` SHALL contain only\nthe resolved local node's enabled provider keys in deterministic Claude\nCode-then-Codex order, each with its ordered `roots`; `index` SHALL contain\nnullable `since_days`. Without a loaded file, `path` SHALL be the absolute\ndefault path, `loaded` false, `local_node` null, `providers` SHALL contain the\ntwo built-in provider root lists, and `since_days` SHALL be 90."}]}
{"claim_id":"distribution/every-build-includes-semantic","hash":"af733491983842befd3f85e9762591a1fa24b5d86f0f37c0d5f53731f9b141e9","representations":[{"adapter":"markdown","hash":"d7f012c7b46439d68fb287a38601eba43c90e809b8a2a29631f429f779af4905","role":"normative","scope":"block","text":"- **WHEN** CI or a developer builds ACHI with any supported Cargo invocation\n- **THEN** the resulting binary includes semantic retrieval and enforces semantic readiness before search"}]}
{"claim_id":"distribution/lexical-only-build-works","hash":"a49f2b5aa07f438390ecb35b2be504f4e9a2a662fce25154cb6a37f7028fc2fb","representations":[{"adapter":"markdown","hash":"8ec8887c541efc6513302c028f36a5d7efa272f3381005aa410668076c666eb5","role":"normative","scope":"block","text":"- **WHEN** ACHI is built with `--no-default-features`\n- **THEN** indexing and search work through FTS5 and truthfully report semantic support as unavailable"}]}
{"claim_id":"distribution/release-includes-semantic","hash":"8d1181c8cee2e55625aa2e96dbf42d2da14e2e2ca7b2f0d1a58562594ba96147","representations":[{"adapter":"markdown","hash":"b6cffc328e517f690082354b13c6f113af303e78de37190491b7d00f8235b18d","role":"normative","scope":"block","text":"- **WHEN** CI publishes an official ACHI binary\n- **THEN** the binary includes the concrete FastEmbed semantic backend"}]}
{"claim_id":"federated-search/concurrent-fanout","hash":"775928a69761dfdc67a1c3e3e868939ab63bd6482cd38be3e73e872ef9ce5ebe","representations":[{"adapter":"markdown","hash":"0b2a8f7ba92ab2f8e0334ba59fa2c3d7bdae9a9c019a6bc7b250c5d3ac665b9d","role":"normative","scope":"block","text":"When nodes are selected, ACHI SHALL begin remote searches concurrently while performing the existing local search. Each remote request SHALL use noninteractive SSH, a fixed remote ACHI command, structured JSON standard input, and a five-second execution deadline. Query text, filters, limits, and identifiers SHALL NOT be interpolated into a remote shell command."},{"adapter":"markdown","hash":"14ea7c345eb1c3212da6ff639d59d971ecc9845ca1ce92ff021e251d70fe3252","role":"normative","scope":"block","text":"When remote nodes are selected, ACHI SHALL begin their configured SSH searches\nconcurrently while performing local hybrid search. Each remote request SHALL\nuse noninteractive SSH, the resolved node's SSH destination, a fixed remote\nACHI command, structured JSON standard input, and the fixed bounded execution\ndeadline. Query text, filters, limits, and identifiers SHALL NOT be\ninterpolated into a remote shell command."}]}
{"claim_id":"federated-search/configured-default-fanout","hash":"c7d039394388890e6417cb47b57e0c3aaf75bbda71a497a4e85f164b1519e3fa","representations":[{"adapter":"markdown","hash":"bf8b389c710667372b779d8152c206ea8ba976cc054e9055e81d2a108cd3aeb0","role":"normative","scope":"block","text":"- **WHEN** Xenia is local and dev-macbook and personal-macbook are search-enabled\n- **THEN** a search without `--node` searches locally and contacts each enabled Mac once"}]}
{"claim_id":"federated-search/deterministic-merge","hash":"6fe54a3eac98006fe6917ea8de6d3a3f14cdcc536767305ac3cbeaf0051372a1","representations":[{"adapter":"markdown","hash":"b28c72f018aef4df33a3d88c448f28590fe2aeea62c09fe221d72bea7aca0a6a","role":"normative","scope":"block","text":"ACHI SHALL merge node-local final rankings without comparing raw BM25 values between databases. It SHALL assign each candidate a reciprocal local-rank score, deduplicate candidates by provider, conversation identifier, and message identifier, retain the highest rank contribution for a duplicate, record every origin, and break equal aggregate scores deterministically by provider, conversation identifier, and message identifier. The final result count SHALL respect `--limit`."}]}
{"claim_id":"federated-search/local-semantic-readiness-is-required","hash":"c5029fbebc43283aaf8614d0700dd3170e911803ec76aa0ddcb2fc8fb5f7b285","representations":[{"adapter":"markdown","hash":"18b75b17d5229d43dc7c96a92ea96c5af38767f9db6fc3708d6860625cf8f8af","role":"normative","scope":"block","text":"- **WHEN** the local database lacks models or current embeddings\n- **THEN** federated search fails with the local typed readiness error even if a remote node could search successfully"}]}
{"claim_id":"federated-search/node-selection-precedence","hash":"c097bc57a9eb24bd2df35c625143b6eae9669a8df8f8787b7fcbb627ebc6639f","representations":[{"adapter":"markdown","hash":"b8502f8f1625599c2fcd4ff1fe0a00bcf39c6176d829b2b2a5ba8a0675d49d71","role":"normative","scope":"block","text":"`achi search` SHALL accept repeated `--node NAME` values naming configured\nremote nodes. When explicit values are present, ACHI SHALL search the local\ndatabase plus the deduplicated named remote subset. Otherwise, with a loaded\nconfiguration, it SHALL search locally plus every other node whose `search`\nvalue is true. The resolved local node SHALL never be contacted through SSH;\nexplicitly naming it SHALL be a typed usage error before local search or SSH.\nWithout configuration or explicit nodes, search SHALL remain local-only and\npreserve the local response shape."},{"adapter":"markdown","hash":"c36242339cf927a26e683910dc7d7dd7b7eabc08db1f6dc69584dd2c37ab0063","role":"normative","scope":"block","text":"`achi search` SHALL accept repeated `--node <SSH_HOST>` values. When at least one explicit value is present, ACHI SHALL use the deduplicated explicit values and ignore `ACHI_SEARCH_NODES`. Otherwise it SHALL use the deduplicated, comma-separated nonempty values from `ACHI_SEARCH_NODES`. With neither source present, search SHALL remain local-only and SHALL preserve the existing local response shape."}]}
{"claim_id":"federated-search/node-validation","hash":"1e3c57a64b452432ce5fc512c74b32e2751e808862d53c82bd9c8f0fa6a63b2f","representations":[{"adapter":"markdown","hash":"03f704991c0ee821de5dade7f14a758c11a1884033c3fb147ca67782e6021c5d","role":"normative","scope":"block","text":"Every configured node name and SSH destination SHALL contain at most 255 ASCII\ncharacters, begin with an ASCII letter or digit, and contain only ASCII letters,\ndigits, `.`, `_`, and `-`. The name `local` SHALL be reserved. An unknown\nexplicit node or invalid configured value SHALL produce a typed error before\nany SSH process starts. ACHI SHALL pass the resolved SSH destination as one\nprocess argument and SHALL never interpolate it into a shell command."},{"adapter":"markdown","hash":"8afe0f68cd695652214cdb74c64a7f15faba9eceda320225f504ecaebbea6344","role":"normative","scope":"block","text":"Every selected node SHALL be a nonempty SSH host alias containing only ASCII letters, digits, `.`, `_`, and `-`, beginning with an ASCII letter or digit. `local` SHALL be reserved and rejected as a remote node. Invalid explicit or environment-provided nodes SHALL produce a typed usage error before any SSH process starts."}]}
{"claim_id":"federated-search/partial-failure","hash":"7144922a0a7562c4a5234c453f0612930855cd2201a792d9138141642921215f","representations":[{"adapter":"markdown","hash":"545d9de2cd20730afca5117cd38d3317a308b1d2cce77b71192057c8d1594948","role":"normative","scope":"block","text":"A remote connection failure, timeout, nonzero exit, malformed response, or incompatible response SHALL NOT suppress successful local or remote results. Federated search SHALL exit successfully when local search succeeds and SHALL include one deterministic outcome for every selected remote node."}]}
{"claim_id":"federated-search/remote-view","hash":"80b2091931fa8b9a0d848e8cf737551dff45c2025ee31f4996ec7f51e0e37196","representations":[{"adapter":"markdown","hash":"cb102ec32eb6c83b0ee74f12426768a2e0d487ffa57a4808fdfedb8110ea3815","role":"normative","scope":"block","text":"`achi view <id> --node NAME --context N` SHALL resolve the configured node name,\nsend the identifier and context through structured standard input to the fixed\nremote ACHI command at that node's SSH destination, and return the compatible\nremote JSON view response. The local node, an unknown name, or a node selected\nwithout loaded configuration SHALL fail before SSH. Without `--node`, view\nSHALL retain local behavior."},{"adapter":"markdown","hash":"eae61c7dac1d5a912317ddb78757c2dcc810cce99d62a7597aaacda2ea8d3ac5","role":"normative","scope":"block","text":"`achi view <id> --node <SSH_HOST> --context N` SHALL validate the node with the search node rules, send the identifier and context through structured standard input to the fixed remote ACHI command, and return the compatible remote JSON view response. Without `--node`, view SHALL retain existing local behavior."}]}
{"claim_id":"federated-search/remote-worker-is-nonrecursive","hash":"0d78ff018f10b2d1c80cb0121e4571b13a2b87710dcf28e4cd5bc974d8dc4f73","representations":[{"adapter":"markdown","hash":"c52570a696eba5139ad6db0078953402a1f94575f4c039e1d6c9cbe8ccc5e9e9","role":"normative","scope":"block","text":"The hidden federation request mode SHALL execute exactly one local hybrid\nsearch or one local view operation. It SHALL NOT load configured default nodes,\nhonor federation-selection environment values, or start SSH, even when a\nconfiguration file exists on the remote machine."}]}
{"claim_id":"federated-search/response-provenance","hash":"abdcb0b7f19067179576f98133a4bb0dce4a201b7e62cbcf76595f3979430555","representations":[{"adapter":"markdown","hash":"efd4d7474c85c89f4b2a27c270e9d70a9dbcb4f6ee410205524442675021a591","role":"normative","scope":"block","text":"A federated search response SHALL identify its realized mode as `federated`, attach an ordered nonempty `origins` array and a federated rank score to every returned result, and include remote node outcomes. Local-only responses SHALL omit federated-only result and response fields."}]}
{"claim_id":"federated-search/semantic-unready-node-is-partial-failure","hash":"96804a1ca41a77dd72dc0454da2fa47cb9764611c93940edfb698e60c8e6dfa8","representations":[{"adapter":"markdown","hash":"c5be5b6ca0f7fbb3532cd5ea53bee5330d1c5f8d109e59afcb67ee0c2919dbd2","role":"normative","scope":"block","text":"- **WHEN** local hybrid search succeeds, one remote node returns hybrid results, and another remote node lacks models or current embeddings\n- **THEN** the response contains local and successful remote results plus an error outcome for the semantically unready node"}]}
{"claim_id":"federated-search/successful-nodes-are-hybrid","hash":"360579cd5cd0e7c4282952080ec39f7d5767e4082f232f503f11053ae0f5da43","representations":[{"adapter":"markdown","hash":"af05ec737467d2a8ac40d9f67ee2d8603d5d9da25b4731a82863414148cb77c6","role":"normative","scope":"block","text":"- **WHEN** local search and one remote search are semantically ready while another remote is not ready\n- **THEN** the aggregate reports federated realization, successful outcomes report hybrid realization, and the unready outcome reports an error without results"}]}
{"claim_id":"independence/no-dickles-franken-surface","hash":"d6b767c47d610e6e362cec8b43ffa1b613594071d45941925f92bac850ce8985","representations":[{"adapter":"markdown","hash":"a30a308486976091f150a1ba359e80d439dd70204edfa577ef9016486be13d81","role":"normative","scope":"block","text":"- **WHEN** final manifests, lockfiles, build scripts, source, tests, workflows,\n  and maintained documentation are scanned\n- **THEN** prohibited legacy dependency surfaces and removed provider surfaces\n  are absent"}]}
{"claim_id":"indexing/canonical-and-fts-are-atomic","hash":"357839b5b2d3f7629846a2b575444e77bf76de637d0c40090569c6693bab5592","representations":[{"adapter":"markdown","hash":"0f78ed777f6f5a69acf23afe614de7167e5edd942fe44e4c48cd43f532a11770","role":"normative","scope":"block","text":"- **WHEN** a canonical writer transaction fails before its checkpoint commits\n- **THEN** neither that transaction's canonical changes nor its row-level or rebuilt FTS state is visible after rollback"},{"adapter":"markdown","hash":"7db813c6697e50ec23ae7a0de84b31abdcbe8bbc2ec6e626bdcfdb2a6d892f41","role":"normative","scope":"block","text":"- **WHEN** a writer transaction fails before its checkpoint commits\n- **THEN** neither that transaction's canonical changes nor its row-level or rebuilt FTS state is visible after rollback"}]}
{"claim_id":"indexing/cli-provider-selection-is-bounded","hash":"0b5893520a61ec863cfcb35a90ca7cacc82fbd837f3b8075c6c81142dafa55ec","representations":[{"adapter":"markdown","hash":"079d0f8094fccde9574373e73f3c4c87acd1b94b30ab85e8d61b1f7a7082ff2b","role":"normative","scope":"block","text":"`achi index` SHALL accept repeatable `--provider PROVIDER` values. Explicit\nprovider selection SHALL restrict that run to the deduplicated named supported\nproviders. Unknown providers or an explicitly selected provider without\nconfigured or built-in roots SHALL fail with a typed JSON usage error before\nscanning. ACHI SHALL NOT expose an ad hoc root override."}]}
{"claim_id":"indexing/complete-scan-purges-missing-source","hash":"a4e1d45e0544c663c008266dc8a30e830c45a91b6108532a2f5625cdfa32713d","representations":[{"adapter":"markdown","hash":"250e4454acfcfd4b28de8042de97f807cc2b4146468601453e728092720c5a18","role":"normative","scope":"block","text":"- **WHEN** a complete successful provider scan no longer discovers a previously indexed source\n- **THEN** its conversation, messages, FTS rows, and embeddings are removed from serving and target coverage"},{"adapter":"markdown","hash":"bed25d9a5087c99c695a29012de838c53862611263e635b539225aec3464556b","role":"normative","scope":"block","text":"- **WHEN** a complete successful provider scan no longer discovers a previously indexed source\n- **THEN** its conversation, messages, FTS rows, and embeddings are removed"}]}
{"claim_id":"indexing/concurrent-writer-is-rejected","hash":"c90da9eecf8e1086bf139e59ad09f6fa523dd922957bd9759cde470c5212c32e","representations":[{"adapter":"markdown","hash":"fdc023f541ade8be05d1e8e1c55ef59966dc095ef3bafce2a926e5dda41f7658","role":"normative","scope":"block","text":"- **WHEN** a second `achi index` targets a database with an active index writer\n- **THEN** it returns a typed JSON busy error without starting a competing refresh"}]}
{"claim_id":"indexing/full-rebuild-is-explicit","hash":"ec076922d0486b7a3bdf75eebc35c41a02561da5aff131500eab9484183dfc44","representations":[{"adapter":"markdown","hash":"9ff1f371cc8caa5755b22d372d1314068eeff592143b5c6074a0029ffbff0971","role":"normative","scope":"block","text":"- **WHEN** `achi index --full` is invoked\n- **THEN** ACHI may rebuild whole-corpus FTS and semantic derived state while preserving canonical message identity"},{"adapter":"markdown","hash":"ed062485d3df4f2e258afb3a736d16a88ecd42e227bf372b329faf95d6d3d6ed","role":"normative","scope":"block","text":"- **WHEN** `achi index --full` is invoked\n- **THEN** ACHI may rebuild whole-corpus FTS and semantic derived state while preserving canonical message identity and any usable serving generation until its replacement can serve"}]}
{"claim_id":"indexing/inaccessible-roots-never-authorize-purge","hash":"76e7dedb042e69fbd69c556031a88044c5c88865414901728af93d1509a17878","representations":[{"adapter":"markdown","hash":"7724d68d2c8d0c6d0258248a2b3ba7c0a3244ae88a431dd6b9e0824287cb0699","role":"normative","scope":"block","text":"Every configured root for a selected provider SHALL be inspected successfully\nbefore that provider's scan is considered complete. A missing, unreadable, or\ndisappearing configured root SHALL return a typed JSON error, mark the provider\nscan incomplete, and preserve every existing canonical row, derived-search\nrow, checkpoint, and tombstone for that provider."}]}
{"claim_id":"indexing/incomplete-scan-preserves-state","hash":"436d042e7f365674f6c6de70b996aa09b119289d6cfd6e57ae11ae7a2bfd0c10","representations":[{"adapter":"markdown","hash":"13327d93bb327fbcf8dbdb26921fad67bc39119b7f4d2edbccc6455ee983c6f5","role":"normative","scope":"block","text":"- **WHEN** provider discovery or parsing fails before a complete scan is established\n- **THEN** previously indexed conversations are not purged as missing"}]}
{"claim_id":"indexing/only-changed-messages-refresh","hash":"6c2d7d12f81009b241510c21aebabe34fd6dd5426845aa5eef241f27f6c6cf16","representations":[{"adapter":"markdown","hash":"4be8a2afc4faad45c808d65788dd643266353548a53aa21105d746dd0441882a","role":"normative","scope":"block","text":"- **WHEN** a previously indexed source contains added or changed messages\n- **THEN** only those messages require new canonical writes and semantic embeddings"},{"adapter":"markdown","hash":"5500749b1b4f345e20031e0aaee7fa207338571cf6906529da548efaff342ba7","role":"normative","scope":"block","text":"- **WHEN** a writer transaction contains fewer changed or removed messages than the declared FTS rebuild cutoff and the embedding generation is unchanged\n- **THEN** only those messages receive canonical and FTS mutations and only added or changed messages receive new embeddings"},{"adapter":"markdown","hash":"fe3f959aec823440f387e342a02c23dadf800cba651d5599cacea9a3b06b8ac4","role":"normative","scope":"block","text":"- **WHEN** a writer transaction contains fewer changed or removed messages than the declared FTS rebuild cutoff and the embedding generation is unchanged\n- **THEN** only those messages receive canonical and FTS mutations and only added, changed, stale, or embedding-missing searchable messages receive new embeddings"}]}
{"claim_id":"indexing/partial-embeddings-resume","hash":"e965f5bf88f1d92c8449e511ccd3785b5668e26723221e7603cc2b10795c72b3","representations":[{"adapter":"markdown","hash":"01b5e0ea8cca3bd326c9eb1d838e139f1235c38010a4ad30a444a1fd03848f56","role":"normative","scope":"block","text":"- **WHEN** indexing stops after at least one derived embedding checkpoint but before current-generation coverage is complete\n- **THEN** committed canonical and FTS state plus completed embedding checkpoints remain durable, search reports not ready, and the next index embeds only rows still missing current-generation vectors"},{"adapter":"markdown","hash":"b3c61fd510d1c1b3b8541ea9d8b886ae4c9c52b4d6afb9bdcdff3ebbd90f38da","role":"normative","scope":"block","text":"- **WHEN** indexing stops after at least one target-generation embedding checkpoint but before target coverage is complete\n- **THEN** committed canonical and FTS state plus completed embedding checkpoints remain durable, covered semantic search remains available, and the next index embeds only target-generation rows still missing vectors"}]}
{"claim_id":"indexing/partial-provider-scan-preserves-others","hash":"53f4f726c44afd7d9461f74f04aac7ab5119defd3ddff0486d462270a7b4fbab","representations":[{"adapter":"markdown","hash":"8d23d17b386dfe38be41005bd6a2dcca1fd0608cdb5e7e7a1d8b0766780f4e66","role":"normative","scope":"block","text":"An index run restricted by `--provider` SHALL reconcile missing sources only\nfor providers actually scanned completely. It SHALL preserve\ncanonical conversations, FTS rows, embeddings, checkpoints, and tombstones for\nall unselected providers."}]}
{"claim_id":"indexing/recency-exclusion-preserves-stored-state","hash":"c464a201c452907ff59f452d428f5baaf6537a3cadfe7535f97618b24b19e9b2","representations":[{"adapter":"markdown","hash":"de4a599b307639263d33eb9df273c06ff8d41767196c897016d788e9c56bcecb","role":"normative","scope":"block","text":"Sources excluded only by the recency horizon SHALL never authorize deletion of\ntheir existing canonical rows, FTS rows, embeddings, checkpoints, or\ntombstones. The horizon is an admission/work limit, not an automatic retention\npolicy."}]}
{"claim_id":"indexing/recency-horizon-bounds-admission-not-retention","hash":"53bc72f2793cbf0c10d276b6f3cb577b5d80a37930776d2be798ef82e8611162","representations":[{"adapter":"markdown","hash":"d44e6619da798cd1c824901e1814d1e11606a743bacbda83ca7c3810098e6666","role":"normative","scope":"block","text":"The resolved recency horizon SHALL determine source eligibility using the\nsource file's modification time relative to one run-start timestamp. A source\nwhose modification time is on or after the inclusive cutoff SHALL be eligible;\nan older source SHALL not be parsed, inserted, updated, or counted as missing.\nWhen a source is eligible, ACHI SHALL ingest its complete conversation rather\nthan truncate messages at the cutoff. With no horizon, every discovered source\nSHALL be eligible."}]}
{"claim_id":"indexing/unchanged-source-is-skipped","hash":"83c3049ec884b8c06dfc68d56dcc86be550680f34138a145c4301378d825037f","representations":[{"adapter":"markdown","hash":"229c0fb06780d6083e87f47ca70a31eb941a565c3f3342b806417146593abd20","role":"normative","scope":"block","text":"- **WHEN** `achi index` sees a source whose fingerprint is unchanged\n- **THEN** it reports the source unchanged without parsing it or rewriting its messages, FTS rows, or current embeddings"},{"adapter":"markdown","hash":"d7c834b8b076e8170923bdd73a7fa8833065afb9faaa34fa1420e9fd62c7fdf1","role":"normative","scope":"block","text":"- **WHEN** `achi index` sees a source whose fingerprint is unchanged\n- **THEN** it reports the source unchanged without parsing it or rewriting its messages, FTS rows, or embeddings"},{"adapter":"markdown","hash":"e5ac6e996ab152be2ccc3d15694fbf2a743354c2641b48aaa4c60bdaeda90413","role":"normative","scope":"block","text":"- **WHEN** `achi index` sees a source whose fingerprint is unchanged\n- **THEN** it reports the source unchanged without rewriting its messages or embeddings"}]}
{"claim_id":"ingestion/configured-provider-roots-index","hash":"325aeb2f336dbe29d18d98fe79b09a87a5d518b78285e98eba17a5098928c39a","representations":[{"adapter":"markdown","hash":"906974d565c2f9ca219788ab740dd8e5f77fda4a6f323257d59e5891e176f456","role":"normative","scope":"block","text":"- **WHEN** the resolved local node enables Claude Code and Codex with valid roots\n- **THEN** `achi index` scans those roots and does not scan absent providers"}]}
{"claim_id":"ingestion/malformed-records-do-not-panic","hash":"c9e3ce1136ed3ae577e3e965a05f9e479893dd65b3bb599038cf53a56bf66130","representations":[{"adapter":"markdown","hash":"ab50749a83e68c59b27f60f54c300e4eda20310d551fb653ec7a18fb9e25f819","role":"normative","scope":"block","text":"- **WHEN** a supported history file contains a malformed record\n- **THEN** indexing returns a typed JSON error or bounded diagnostic without panicking"},{"adapter":"markdown","hash":"da184d5c61c907f9716ca818a4dc420ad728ef2e6f48371f29b7a804cac7d26d","role":"normative","scope":"block","text":"- **WHEN** a supported JSONL file contains a malformed record\n- **THEN** indexing returns a typed JSON error or bounded diagnostic without panicking"}]}
{"claim_id":"ingestion/provider-boundary","hash":"30e0b0ed6dbba9cb29dbf8893c505eec11cba5c99f7e7783a8b4a5fde84cf6f6","representations":[{"adapter":"markdown","hash":"669b5f0b7737d0ea5e0f1ec1dac24d322d322e5b9a29c9ee70dc611b08c56094","role":"normative","scope":"block","text":"The system SHALL discover and normalize only Claude Code and Codex histories\ninto ACHI-owned canonical conversation and message records. With a loaded\nconfiguration, provider presence in the resolved local node's `providers`\nobject SHALL enable that provider and its configured roots; absent providers\nSHALL not be scanned. Without a loaded configuration, these two concrete\nproviders SHALL retain their built-in local roots. OpenCode, GitHub Copilot\nCLI, Hermes Agent, Pi, and every other provider SHALL have no discovery or\nconfiguration surface."},{"adapter":"markdown","hash":"800386e1dda45335f33c03675377f5946491912cbddbc23551f3ab15711e483b","role":"normative","scope":"block","text":"The system SHALL discover and normalize Claude Code, Codex, current OpenCode,\nGitHub Copilot CLI, Hermes Agent, and Pi histories into ACHI-owned canonical\nconversation and message records."}]}
{"claim_id":"ingestion/supported-jsonl-indexes","hash":"6bd2674e27f1c90dc6f89ccc21d97aa255b9dc7d2fdc28ad36c9dc4b1a88f33b","representations":[{"adapter":"markdown","hash":"9c94c92f2f056ad49712e84885052e8ec70d4f7a96088ff854e0219f2f2859ab","role":"normative","scope":"block","text":"- **WHEN** configured roots contain representative histories from each of the six supported providers\n- **THEN** `achi index` persists their conversations and messages with stable IDs"}]}
{"claim_id":"ingestion/unsupported-providers-ignored","hash":"d310f68a8cff8aafab63e4681b539e6416abc0e01639e3d20708f9f7addb3372","representations":[{"adapter":"markdown","hash":"889b5cd7a51774c1a8f99e8eca5c3d02b38e2a23acc6ac5f30b99e3e3b57d0ea","role":"normative","scope":"block","text":"- **WHEN** a root contains only another provider's history\n- **THEN** no conversation from that provider is indexed or advertised as supported"},{"adapter":"markdown","hash":"f383df1b86e8bad520167303ed0758acf90f8e56fabd52e2e28693ee4bbb6ad2","role":"normative","scope":"block","text":"- **WHEN** a configured supported root contains only another provider's history\n- **THEN** no conversation from that provider is indexed or advertised as supported"}]}
{"claim_id":"models/download-is-explicit","hash":"28611363371a68f0684e1573f8677ebf5895f574f6584c02d9d869b562dde9e6","representations":[{"adapter":"markdown","hash":"a92d3642742c6a85f8e62cf5545e602b5256b4f5c32bd745d09c2089953eeaf8","role":"normative","scope":"block","text":"- **WHEN** models are absent and no `models install` command is run\n- **THEN** `index`, `search`, and `status` do not download model assets"},{"adapter":"markdown","hash":"eabd0bc088ff38345f08e67ed3f05a7c44a3c16fa61ad4341339c8203c617768","role":"normative","scope":"block","text":"- **WHEN** models are absent and no `models install` command is run\n- **THEN** ACHI does not download models implicitly"}]}
{"claim_id":"progressive-readiness/compatible-rollover-keeps-serving","hash":"32a47b27fb6e96bddf7fec4250edefed130e5d60eb2d420984d56883272c53c5","representations":[{"adapter":"markdown","hash":"4062d63641b7c5694844c5ebb85b4c58b4d6d7bc80c510044102b63b398b0c9d","role":"normative","scope":"block","text":"- **WHEN** a fully covered compatible serving generation exists and replacement target coverage is incomplete\n- **THEN** search continues against only the old serving generation while coverage reports the distinct incomplete target generation"}]}
{"claim_id":"progressive-readiness/compatible-rollover-switches-atomically","hash":"f6278ea299351c403dd1b5a87a526f5db97f22c4550fab05aa38766cb9b02c4c","representations":[{"adapter":"markdown","hash":"72ad7ab89e0a7a2c2e3d090647ca35e034028ee5534b4a5e5b05d6f6dd34e6e8","role":"normative","scope":"block","text":"- **WHEN** the replacement target generation reaches complete coverage\n- **THEN** one committed state transition makes it the serving generation for subsequent searches without exposing a mixed-generation result set"}]}
{"claim_id":"progressive-readiness/coverage-is-reported","hash":"659cc9a34ab57e36723295b345265b802ac649e1d3d103a1b21473c9669dbbc9","representations":[{"adapter":"markdown","hash":"9afdfcd038393f942362e57f6432a491c9a86824ab87b0c37f85e02c32b21291","role":"normative","scope":"block","text":"- **WHEN** 60 of 100 searchable messages have target-generation vectors and that target is serving\n- **THEN** `status` and successful `search` report 60 serving vectors, 60 target vectors, 100 searchable messages, 40 pending vectors, and incomplete coverage"}]}
{"claim_id":"progressive-readiness/federated-coverage-is-node-local","hash":"71975f49c22004fc4698806acb16200fde4bb3a94db98bc7a0f85a9efd065ad2","representations":[{"adapter":"markdown","hash":"eb9358e4d02e164abf1a16fd10a7369b61d8f0809f95f6abe9e165f8341f8865","role":"normative","scope":"block","text":"- **WHEN** a federated search succeeds across nodes with different committed coverage\n- **THEN** the response reports local coverage at the top level and each successful remote node's coverage in that node's outcome without summing the counts"}]}
{"claim_id":"progressive-readiness/interruption-resumes","hash":"e48fdc4830486a2097ec034f5a5676d24edc255e78e49ce009e6da92439fb162","representations":[{"adapter":"markdown","hash":"0f4ccf08863d5773756ca77cb4cc3a3938af23c45af0299099b626cfd020674c","role":"normative","scope":"block","text":"- **WHEN** indexing resumes after a partial target-generation checkpoint\n- **THEN** it preserves already committed vectors and continues with only the remaining missing messages in deterministic newest-first order"}]}
{"claim_id":"progressive-readiness/newest-first","hash":"6889b3b23cd49c66b3c140aad939071f9539600ae83aa679b4ac3147849df926","representations":[{"adapter":"markdown","hash":"a248ceb17501773bc52ca43b8c11fbb6a8613754f7d78c10b8dab52e856b728c","role":"normative","scope":"block","text":"- **WHEN** old and recent messages both lack target-generation vectors and indexing stops after its first embedding checkpoint\n- **THEN** the committed covered subset contains the most recent deterministic prefix of missing messages, including every member of any committed duplicate-text group"}]}
{"claim_id":"progressive-readiness/partial-search-is-semantic","hash":"7d6891cb0b9c23b62fcabe682c536fd5123477d88171199a27369cd4d3554efb","representations":[{"adapter":"markdown","hash":"e503a03579cf5f6e4a945893005889d71791d0fb1b5d5112b5461326fad31f9c","role":"normative","scope":"block","text":"- **WHEN** a non-empty database has committed serving-generation vectors for some but not all searchable messages\n- **THEN** `achi search` succeeds in hybrid mode, reports partial semantic coverage, and every returned message has a serving-generation vector"}]}
{"claim_id":"progressive-readiness/results-use-one-generation","hash":"93a75a2809db6d7d077d090f6fd2ceebf2e5c07c29b0cbfd6c4fb84a25d11d73","representations":[{"adapter":"markdown","hash":"a98ba98a29fb06796b21b8ed5f5fefeba3cbeef1b2054653c66205d1aaebd030","role":"normative","scope":"block","text":"- **WHEN** an uncovered message is a stronger FTS match than every covered message\n- **THEN** the uncovered message does not enter lexical candidates, fusion, reranking, or results for that search"}]}
{"claim_id":"progressive-readiness/zero-coverage-fails","hash":"ea6c76d378f57774984e65ba1e10cfb5e55b50b3dab58f677bb003c144f29e40","representations":[{"adapter":"markdown","hash":"a2352b3409355252f74a6a1ea77b02fce59251b2b831f2e5067d86519657b8de","role":"normative","scope":"block","text":"- **WHEN** a non-empty database has no committed vector in a usable serving generation\n- **THEN** `achi search` fails with JSON `error.kind` equal to `search-not-ready`, recommends `index`, and returns no lexical results"}]}
{"claim_id":"search/fts-contributes-to-hybrid","hash":"d0c5531dbac11fd9feb05fcb4da9e67463af0630f61472b63884fa879531af39","representations":[{"adapter":"markdown","hash":"5210be574c6cc04fa5275e622e5885c4b928ba6a4fb6628e7f21c72c89fb80c4","role":"normative","scope":"block","text":"- **WHEN** current semantic models and embeddings are ready and an indexed message contains a distinctive query term\n- **THEN** `achi search` may retrieve that message through FTS5, includes it in fusion and reranking, and reports hybrid realization"}]}
{"claim_id":"search/lexical-returns-distinctive-match","hash":"82cc6cf5fa26c5ebc49be0f6c175ddf1c2c289019f79ee5114b38f19cf30b5c0","representations":[{"adapter":"markdown","hash":"98a661639106900e77361128b114e681e3d4502c9533395dc122bc444f5fd81e","role":"normative","scope":"block","text":"- **WHEN** an indexed message contains a distinctive query term\n- **THEN** `achi search` returns that message with a stable identifier and lexical score metadata"}]}
{"claim_id":"search/mixed-message-excludes-tool-result-text","hash":"16656776abadb6bd1c84693de90f842e2c451a62324bcfd3f195b578d8a033db","representations":[{"adapter":"markdown","hash":"f6638a98d9af34414c081bda5e60d744a503836f73b41550d09549f91b73fd74","role":"normative","scope":"block","text":"- **WHEN** one canonical message contains conversational text and a structured tool-result block\n- **THEN** its conversational text can participate in FTS and embeddings while terms unique to the tool-result block cannot"}]}
{"claim_id":"search/tool-results-are-not-searchable","hash":"555c867278071b707ebe3963c739b4bf8e672923d26fe06e576cd9727302551a","representations":[{"adapter":"markdown","hash":"43866f509ea303ecd52b1e26115ba7583b9f68be272dfc480543388f22417875","role":"normative","scope":"block","text":"- **WHEN** a term occurs only inside a pure tool-result message\n- **THEN** `achi search` does not return that message and semantic readiness does not require an embedding for it"}]}
{"claim_id":"semantic-indexing/batching-preserves-vectors","hash":"ec5f0f3de32b2dd9e4b18a001913935baa4971ec740d0f1183b11d92b9f2ed65","representations":[{"adapter":"markdown","hash":"a8090c8f680f2e6bfb7bffacb577e41fc3d60cf3d6d6be2c866e2d869f587267","role":"normative","scope":"block","text":"- **WHEN** representative short and long searchable messages are compared between the reference and canonical length-aware policies\n- **THEN** each vector has at least 0.98 quantized cosine similarity, repeated canonical runs are byte-deterministic, and the retrieval fixture retains its expected relevant results"}]}
{"claim_id":"semantic-indexing/cold-throughput-target","hash":"1c612b89db9c9a71fc41a9937940ab3b464a24dc949942325f1742bd89731bff","representations":[{"adapter":"markdown","hash":"348325f12437817f32d31ec8712fef39bf90ed3526ca70447c37bb69d34f0f94","role":"normative","scope":"block","text":"- **WHEN** the focused benchmark is run on Xenia against the recorded representative corpus shape\n- **THEN** it reports at least 220 stored vectors per second, at least 0.98 reference-vector cosine similarity, and retained retrieval-fixture relevance"}]}
