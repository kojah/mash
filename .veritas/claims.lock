{"claim_id":"semantic/inference-failure-fails-search","hash":"61ef0337d8e72bb73922665308d7a267408b305517b5856dd9c1c6a7816132e5","representations":[{"adapter":"markdown","hash":"54d7bd8edf7db8e4f1a39d3366b52cb3d7ef9d2dae5fc77fcb915539ba32facd","role":"normative","scope":"block","text":"- **WHEN** installed semantic assets cannot load or embedding or reranking inference fails\n- **THEN** `achi search` exits unsuccessfully with JSON `error.kind` equal to `model`, an applicable explicit recommended action, no results or fallback fields, and never returns lexical fallback results"}]}
