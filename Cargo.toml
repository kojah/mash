[package]
name = "mash"
version = "0.7.0"
edition = "2024"
description = "Multi-Agent Search History for Claude Code and Codex JSONL sessions"
license = "MIT"
repository = "https://github.com/kojah/mash"
default-run = "mash"
autobins = false
autotests = false
autoexamples = false
autobenches = false
build = false

[lib]
path = "app/lib.rs"

[[bin]]
name = "mash"
path = "app/main.rs"
test = false

[[bin]]
name = "mash-mcp"
path = "app/mcp_main.rs"
test = false

[[test]]
name = "cli_contract"
path = "app/tests/cli_contract.rs"

[dependencies]
rmcp = { version = "3.4.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
blake3 = "1.8.5"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
fastembed = { version = "6.0.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
tokio-postgres = "0.7.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
webpki-roots = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["coreml"] }

[dev-dependencies]
postgres = "0.19.14"
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
veritas-test-macros = { git = "ssh://git@github.com/jamesqo/veritas.git", rev = "9eb6b751c13523f2174b0040eadb5858f31c9e04" }

[profile.release]
codegen-units = 16
strip = true
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
