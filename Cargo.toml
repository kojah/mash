[package]
name = "mash"
version = "0.7.0"
edition = "2024"
description = "Multi-Agent Search History for local agent conversations"
license = "MIT"
repository = "https://github.com/kojah/mash"
default-run = "mash"
autobins = false
autotests = false
autoexamples = false
autobenches = false
build = "build.rs"

# `cargo binstall --git https://github.com/kojah/mash mash` downloads the
# release archive instead of compiling ("mash" on crates.io is another crate).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mash-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[workspace]
members = ["crates/mash-query", "crates/mash-fleet"]
default-members = [".", "crates/mash-query", "crates/mash-fleet"]
resolver = "3"

[lib]
path = "app/lib.rs"

[[bin]]
name = "mash"
path = "app/main.rs"
test = false

[[bin]]
name = "mash-server"
path = "app/server_main.rs"
test = false

[[test]]
name = "cli_contract"
path = "app/tests/cli_contract.rs"

[[example]]
name = "history-skill"
path = "app/examples/history_skill.rs"

[features]
console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
console-subscriber = { version = "0.5", optional = true }
mash-query = { path = "crates/mash-query" }
mash-fleet = { path = "crates/mash-fleet" }
aho-corasick = "1.1.5"
regex = "1.12"
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "io-util", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
getrandom = "0.4"
tokio-util = { version = "0.7", features = ["io-util", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
futures-util = "0.3"
indicatif = "0.18.6"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
tempfile = "3.27.0"
notify = "8.2.0"
blake3 = "1.8.5"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
fastembed = { version = "6.0.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite", "blob", "functions", "hooks"] }
rusqlite_migration = "2.6.0"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22.1"
prost = "0.14.4"
qdrant-client = { version = "=1.20.0", default-features = false, features = ["serde"] }
tonic = { version = "0.14.9", features = ["transport", "tls-native-roots"] }
zstd = "0.13.3"
# `mash qdrant install` unpacks one pinned, checksum-verified release archive.
flate2 = "1.1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
schemars = "1.2"
# The dashboard's OpenAPI document. Pinned: 0.16 is the first line that reads
# schemars 1 schemas, and it is still a pre-release.
aide = { version = "=0.16.0-alpha.4", features = ["axum", "axum-json", "axum-query", "axum-ws"] }
walkdir = "2.5.0"
same-file = "1.0.6"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["coreml"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[dev-dependencies]
tonic-prost = "0.14.9"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
shlex = "2.0.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ort = { version = "2.0.0-rc.13", default-features = false }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Dependencies keep file and line numbers for backtraces but not full debug
# info: it made each debug executable about a quarter larger, and a full test
# build links several of them. Mash's own crates keep the default.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
codegen-units = 16
# Keep symbol names so a stuck or crashed process can be diagnosed with
# gdb or a backtrace; debug info stays stripped to keep the binary small.
strip = "debuginfo"
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = "warn"
pedantic = "warn"
