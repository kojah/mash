[package]
name = "mash"
version = "0.7.0"
edition = "2024"
description = "Multi-Agent Search History for Claude Code and Codex JSONL sessions"
license = "MIT"
repository = "https://github.com/kojah/mash"
default-run = "mash"
autobins = false
autotests = false
autoexamples = false
autobenches = false
build = false

[lib]
path = "app/lib.rs"

[[bin]]
name = "mash"
path = "app/main.rs"
test = false

[[test]]
name = "cli_contract"
path = "app/tests/cli_contract.rs"

[dependencies]
rmcp = { version = "3.4.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "io-util"] }
axum = "0.8"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "tls-rustls-webpki-roots"] }
getrandom = "0.4"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
indicatif = "0.18.6"
tempfile = "3.27.0"
notify = "8.2.0"
blake3 = "1.8.5"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
fastembed = { version = "6.0.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["coreml"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[dev-dependencies]
postgres = "0.19.14"
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
codegen-units = 16
strip = true
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
