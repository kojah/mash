[package]
name = "mash"
version.workspace = true
edition = "2024"
description = "Multi-Agent Search History for local agent conversations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mashium/mash"
default-run = "mash"
autobins = false
autotests = false
autoexamples = false
autobenches = false

# `cargo binstall --git https://github.com/mashium/mash mash` downloads the
# release archive instead of compiling ("mash" on crates.io is another crate).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mash-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[workspace.package]
version = "0.7.0"

[workspace]
members = ["app", "crates/mash-query", "crates/mash-fleet", "crates/mash-model", "crates/mash-silver", "crates/mash-storage", "crates/mash-search", "crates/mash-sync", "crates/mash-dash", "crates/mash-mcp", "crates/mash-server"]
default-members = [".", "app", "crates/mash-query", "crates/mash-fleet", "crates/mash-model", "crates/mash-silver", "crates/mash-storage", "crates/mash-search", "crates/mash-sync", "crates/mash-dash", "crates/mash-mcp", "crates/mash-server"]
resolver = "3"

[lib]
path = "cli/lib.rs"

[[bin]]
name = "mash"
path = "cli/main.rs"
test = false

[[bin]]
name = "mash-server"
path = "cli/server_main.rs"
test = false

[[test]]
name = "cli_contract"
path = "cli/tests/cli_contract.rs"

[[example]]
name = "history-skill"
path = "cli/examples/history_skill.rs"

[features]
console = ["mash-app/console"]

[dependencies]
mash-app = { path = "app" }
mash-dash = { path = "crates/mash-dash" }
mash-mcp = { path = "crates/mash-mcp" }
mash-server = { path = "crates/mash-server" }
mash-model = { path = "crates/mash-model" }
clap = { version = "4.6.1", features = ["derive"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "io-util", "process"] }

[dev-dependencies]
mash-model = { path = "crates/mash-model", features = ["test-support"] }
tempfile = "3.27.0"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
blake3 = "1.8.5"
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite", "blob", "functions", "hooks"] }
axum = { version = "0.8", features = ["ws"] }
walkdir = "2.5.0"
mash-silver = { path = "crates/mash-silver", features = ["test-support"] }
tonic-prost = "0.14.9"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
shlex = "2.0.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ort = { version = "2.0.0-rc.13", default-features = false }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Dependencies keep file and line numbers for backtraces but not full debug
# info: it made each debug executable about a quarter larger, and a full test
# build links several of them. Mash's own crates keep the default.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
codegen-units = 16
# Keep symbol names so a stuck or crashed process can be diagnosed with
# gdb or a backtrace; debug info stays stripped to keep the binary small.
strip = "debuginfo"
panic = "abort"
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = "warn"
pedantic = "warn"
