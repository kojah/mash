[package]
name = "mash-app"
version.workspace = true
edition = "2024"
description = "Mash's application library: silver storage, views, search, sync, the shared server, MCP and the dashboard"
license = "MIT"
publish = false
build = "build.rs"

[lib]
path = "lib.rs"

[features]
console = ["mash-search/console"]
# Fixtures and hooks the tests of other workspace crates need.
test-support = ["mash-sync/test-support"]

[dependencies]
mash-query = { path = "../crates/mash-query" }
mash-fleet = { path = "../crates/mash-fleet" }
mash-model = { path = "../crates/mash-model" }
mash-silver = { path = "../crates/mash-silver" }
mash-search = { path = "../crates/mash-search" }
mash-sync = { path = "../crates/mash-sync" }
mash-storage = { path = "../crates/mash-storage" }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "io-util", "process"] }
axum = { version = "0.8", features = ["ws"] }
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
getrandom = "0.4"
tracing = "0.1"
futures-util = "0.3"
tempfile = "3.27.0"
notify = "8.2.0"
blake3 = "1.8.5"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite", "blob", "functions", "hooks"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22.1"
prost = "0.14.4"
# `mash qdrant install` unpacks one pinned, checksum-verified release archive.
flate2 = "1.1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
schemars = "1.2"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
mash-sync = { path = "../crates/mash-sync", features = ["test-support"] }
mash-search = { path = "../crates/mash-search", features = ["test-support"] }
mash-storage = { path = "../crates/mash-storage", features = ["test-support"] }
mash-model = { path = "../crates/mash-model", features = ["test-support"] }
mash-silver = { path = "../crates/mash-silver", features = ["test-support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = "warn"
pedantic = "warn"
# Items here are public only so the other workspace crates can use them. These
# lints document a published API; they did not apply to the same items while
# they were crate-private in `mash`, and still do not.
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
