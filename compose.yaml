name: mash

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The official image has Bash but no curl or wget. Check HTTP readiness,
      # not merely whether the listening socket has opened.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == HTTP/*' 200 '* ]]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  qdrant-data:
