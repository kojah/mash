[project]
name = "mash-github"
version = "0.1.0"
description = "Read-only GitHub issue and pull request ingestion through the Mash connector SDK"
requires-python = ">=3.11"
dependencies = [
    "mash-sdk",
    "githubkit>=0.16.1,<0.17",
    "pydantic>=2.12,<3",
    "orjson>=3.11,<4",
    "click>=8.1,<9",
]

[project.scripts]
mash-github = "mash_github.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
mash-sdk = { path = "../../../sdk/python", editable = true }

[dependency-groups]
dev = ["ruff==0.15.20", "ty==0.0.38"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
