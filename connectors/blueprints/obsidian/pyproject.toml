[project]
name = "mash-obsidian"
version = "0.1.0"
description = "Read-only Obsidian vault ingestion through the Mash connector SDK"
requires-python = ">=3.11"
dependencies = [
    "mash-sdk",
    "pydantic>=2.12,<3",
    "orjson>=3.11,<4",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
]

[project.scripts]
mash-obsidian = "mash_obsidian.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]
mash-sdk = { path = "../../../sdk/python", editable = true }

[dependency-groups]
dev = ["ruff==0.15.20", "ty==0.0.38", "types-PyYAML>=6.0"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
