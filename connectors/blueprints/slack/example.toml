# `mash-slack login --config FILE` writes this file for a new FILE; this is the
# same shape for reference. Paths are relative to this file; ~ expands.
team_id = "T0123456789" # The workspace.
# The Slack user the token reads as; the Mash source is slack:T0123456789:U0123456789.
# A second account in one workspace is a second source with its own file.
principal = "U0123456789"
token_file = "slack.token" # Saved by login, readable only by you; never print it.
state_dir = "~/.local/share/mash/connectors/slack/T0123456789-U0123456789"
channels = ["C0123456789", "C9876543210"] # Explicit channel ID allowlist.
# history_days = 90 # By message creation time; omit for all history.
thread_days = 7 # Each poll rechecks threads and edits this far back.
poll_seconds = 300

[[destinations]]
type = "local"
database = "~/.local/share/mash/mash.sqlite3"
executable = "mash"
# config = "~/.config/mash/config.toml"

# Shared publication is an independent explicit destination; native node
# publication does not carry connector records. Credentials stay in the env.
