version = 1
connector = "slack"
python = [3, 11]

[[requirements]]
id = "python"
when = "always"
description = "Python 3.11 or newer"
remedy = "Run uv sync --project connectors/blueprints/slack --locked."

[[requirements]]
id = "token"
when = "always"
description = "A Slack user (xoxp-) or bot (xoxb-) token in the configured environment variable"
remedy = "Export the token of a Slack app installed in the workspace in token_env (default SLACK_TOKEN)."

[[requirements]]
id = "slack_access"
when = "always"
description = "Slack accepts the token for team_id and it can read every selected channel and its members' names"
remedy = "Add the read scopes in connectors/blueprints/slack/README.md and reinstall the app; invite a bot to each channel. sync reports Slack's error per channel."

[[requirements]]
id = "state"
when = "always"
description = "Writable persistent connector state"
remedy = "Set state_dir to a directory this user can create or write."

[[requirements]]
id = "mash"
when = "local"
description = "An installed Mash executable"
remedy = "Install Mash and set destinations.executable to its path."

[[requirements]]
id = "database"
when = "local"
description = "A writable local silver database compatible with the installed Mash"
remedy = "Select a writable database; use Mash export/import for schema changes."

[[requirements]]
id = "credentials"
when = "shared"
description = "A Mash node token in the configured environment variable"
remedy = "Set token_env to an environment variable containing this node's API token."

[[requirements]]
id = "authority"
when = "shared"
description = "Network access and a token authorized for the configured node/group"
remedy = "Verify the shared service and node credentials; delivery verifies authorization."
