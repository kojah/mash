version = 1
connector = "discord"
python = [3, 11]

[[requirements]]
id = "python"
when = "always"
description = "Python 3.11 or newer"
remedy = "Run uv sync --project connectors/discord --locked."

[[requirements]]
id = "token"
when = "always"
description = "A Discord bot token in the configured environment variable"
remedy = "Export the bot token from the Developer Portal in token_env (default DISCORD_BOT_TOKEN). User tokens are not supported."

[[requirements]]
id = "discord_access"
when = "always"
description = "Discord accepts the token, the Message Content intent is enabled and the bot can read every selected channel and thread"
remedy = "Enable the Message Content intent and grant View Channel and Read Message History in each channel; sync reports the intent and HTTP 401/403/404 per channel."

[[requirements]]
id = "state"
when = "always"
description = "Writable persistent connector state"
remedy = "Set state_dir to a directory this user can create or write."

[[requirements]]
id = "mash"
when = "local"
description = "An installed Mash executable"
remedy = "Install Mash and set destinations.executable to its path."

[[requirements]]
id = "database"
when = "local"
description = "A writable local silver database compatible with the installed Mash"
remedy = "Select a writable database; use Mash export/import for schema changes."

[[requirements]]
id = "credentials"
when = "shared"
description = "A Mash node token in the configured environment variable"
remedy = "Set token_env to an environment variable containing this node's API token."

[[requirements]]
id = "authority"
when = "shared"
description = "Network access and a token authorized for the configured node/group"
remedy = "Verify the shared service and node credentials; delivery verifies authorization."
