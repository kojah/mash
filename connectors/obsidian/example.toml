# All paths are relative to this configuration file; ~ expands to your home.
vault = "~/Obsidian/My Vault"
vault_id = "my-vault" # Stable across renames, moves and connector restarts.
state_dir = "~/.local/share/mash/connectors/obsidian/my-vault"
folders = ["."] # Explicit allowlist; [] is rejected. . means the whole vault.
recursive = true
poll_seconds = 5
deletion_grace_seconds = 2
# Omit history_days to include unknown creation dates and all existing notes.
# history_days = 90 # Requires a timezone-aware `created` frontmatter timestamp.

[[destinations]]
type = "local"
database = "~/.local/share/mash/mash.sqlite3"
executable = "mash"
# config = "~/.config/mash/config.toml"

# Shared publication is an independent explicit destination; native node
# publication does not carry connector records. Credentials stay in the env.
