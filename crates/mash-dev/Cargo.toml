[package]
name = "mash-dev"
version = "0.1.0"
edition = "2024"
description = "Project-specific deployment and refresh MCP for Mash"
license = "MIT"

[[bin]]
name = "mash-dev-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.4.0", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
