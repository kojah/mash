[package]
name = "mash-dev"
version = "0.2.0"
edition = "2024"
description = "Deployment checks and explicit refresh over Mash MCP"
autobins = false
license = "MIT"

[[bin]]
name = "mash-dev-probe"
path = "src/probe.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
