[package]
name = "mash-fleet"
version = "0.2.0"
edition = "2024"
description = "Mash fleet management through Ansible and MCP"
autobins = false
license = "MIT"

[[bin]]
name = "mash-fleet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
blake3 = "1.8.5"
tempfile = "3.27.0"


[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
