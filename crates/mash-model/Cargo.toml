[package]
name = "mash-model"
version = "0.1.0"
edition = "2024"
description = "Vocabulary shared by the Mash crates: roles, providers, tool activity, attachments, masking and errors"
license = "MIT"
publish = false

[features]
# Fixtures the tests of other workspace crates need.
test-support = ["dep:axum"]

[dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
base64 = "0.22.1"
blake3 = "1.8.5"
directories = "6.0.0"
indicatif = "0.18.6"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12"
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite", "blob", "functions", "hooks"] }
schemars = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net"] }
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
# Items here are public only so the other workspace crates can use them. These
# lints document a published API; they did not apply to the same items while
# they were crate-private in `mash`, and still do not.
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
