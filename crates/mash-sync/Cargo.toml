[package]
name = "mash-sync"
version.workspace = true
edition = "2024"
description = "Mash's shared index: the node-side client, sync and publication, and the server's silver store"
license = "MIT"
publish = false

# The sources stay under `app/shared/`, as `mash-storage`'s and `mash-search`'s
# stay under `app/`.
[lib]
path = "../../app/mash_sync.rs"

[features]
# Fixtures and hooks the tests of other workspace crates need.
test-support = ["mash-search/test-support"]

[dependencies]
console-subscriber = { version = "0.5", optional = true }
mash-query = { path = "../mash-query" }
mash-model = { path = "../mash-model" }
mash-silver = { path = "../mash-silver" }
mash-search = { path = "../mash-search" }
mash-storage = { path = "../mash-storage" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "io-util", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
getrandom = "0.4"
tokio-util = { version = "0.7", features = ["io-util", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
futures-util = "0.3"
tempfile = "3.27.0"
blake3 = "1.8.5"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite", "blob", "functions", "hooks"] }
base64 = "0.22.1"
prost = "0.14.4"
zstd = "0.13.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
schemars = "1.2"

[dev-dependencies]
mash-search = { path = "../mash-search", features = ["test-support"] }
mash-storage = { path = "../mash-storage", features = ["test-support"] }
mash-model = { path = "../mash-model", features = ["test-support"] }
mash-silver = { path = "../mash-silver", features = ["test-support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
# Items here are public only so the other workspace crates can use them. These
# lints document a published API; they did not apply to the same items while
# they were crate-private in `mash`, and still do not.
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
return_self_not_must_use = { level = "allow", priority = 1 }
