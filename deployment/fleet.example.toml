# Copy outside the checkout and replace paths, hosts, and trusted commands.
# Credentials are environment variable references, never literal secrets.
version = 1

[controller]
node = "workstation"
repository = "/home/operator/mash"
binary = "/home/operator/bin/mash-fleet"
jobs = "/home/operator/mash-private/fleet-jobs"
allow_actions = ["status", "watch-start", "watch-stop", "watch-status"]

[[machines]]
id = "workstation"
platform = "linux"
dashboard_url = "http://127.0.0.1:8790"
token_env = "MASH_WORKSTATION_SERVICES_TOKEN"

[machines.transport]
kind = "local"

[machines.deployment]
connection_check = ["true"]
mcp = ["/home/operator/bin/mash", "mcp"]

[machines.watcher]
home = "/home/operator"
launcher = "/home/operator/bin/mash-watch"
allow_control = true

# A shared server is a service of the machine that runs it. With a
# `deployment` table it is also a fleet target named by its id, so
# `mash-fleet deploy shared-server workstation` installs it before the
# machines that require it. Without one it is only shown and controlled.
[[machines.services]]
id = "shared-server"
name = "Shared Mash server"
kind = "server"
manager = "systemd_user"
unit = "mash-shared.service"
allow_control = true

[machines.services.deployment]
preflight = [["/home/operator/bin/mash-server-release", "preflight"]]
install = [["/home/operator/bin/mash-server-release", "install"]]
verify = [["/home/operator/bin/mash-server-release", "check"]]
replay_views = [["/home/operator/bin/mash-server-release", "replay-views"]]

[[machines.databases]]
id = "history"
name = "Agent history"
path = "/home/operator/.mash/silver.sqlite3"

[[machines]]
id = "macbook"
platform = "darwin"
dashboard_url = "http://100.64.0.12:8790"
token_env = "MASH_MACBOOK_SERVICES_TOKEN"

[machines.transport]
kind = "ssh"
host = "100.64.0.12"
user = "operator"

[machines.deployment]
connection_check = ["ssh", "operator@100.64.0.12", "true"]
mcp = ["ssh", "operator@100.64.0.12", "/Users/operator/bin/mash", "mcp"]

[machines.watcher]
home = "/Users/operator"
launcher = "/Users/operator/bin/mash-watch"
allow_control = true
