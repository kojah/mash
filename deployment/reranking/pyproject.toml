[project]
name = "mash-reranking-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "modal==1.6.3",
  "fastapi>=0.115,<1",
  "numpy==2.2.6",
  "tokenizers==0.22.1",
  "huggingface-hub>=0.35,<1",
  "zstandard>=0.23,<1",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14", "ty>=0.0.1", "onnxruntime==1.23.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
