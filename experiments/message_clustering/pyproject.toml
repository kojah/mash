[project]
name = "mash-message-clustering-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.6,<2",
    "click>=8,<9",
    "pydantic>=2,<3",
    "orjson>=3,<4",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.22,<0.24",
    "blake3>=1,<2",
    "optuna>=4,<6",
    "mlflow>=3.7,<4",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
