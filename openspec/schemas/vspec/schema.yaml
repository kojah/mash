name: vspec
version: 1
description: OpenSpec change governance with Veritas claims, planning, and evidence gates

artifacts:
  - id: proposal
    generates: proposal.md
    description: Change motivation, scope, capabilities, and success boundary
    template: proposal.md
    instruction: |
      Require completed VSpec project bootstrap. The OpenSpec project context
      must record user-confirmed implementation language, native test
      framework, compatible Veritas evidence producer, and the workflow skill
      catalog root or roots. If any choice is absent or unsupported, stop and
      invoke `vspec-init`; do not write proposal.md.

      Later artifacts name workflow skills without addresses. Resolve each one
      under a recorded catalog root. When a name resolves elsewhere, record
      that root in project context so the next consumer does not repeat the
      search.

      Before writing proposal.md, require project-bound Veritas access. Prefer
      active MCP. When MCP is unavailable, permit `vtas` CLI fallback only
      after `vtas --project <absolute-project-root> status --json` succeeds.
      Record access mode in project context. Stop only when neither path works.

      Invoke `draft-spec` to create or revise proposal.md. Treat this change's
      proposal path and the requirements below as that workflow's output
      contract; do not create a separate requirements artifact.

      Name every new or modified OpenSpec capability. Keep implementation
      choices out of this artifact. Record observable success and explicit
      non-goals so later artifacts cannot grow scope silently. Inspect
      `openspec/product/README.md` and `openspec/architecture/README.md` plus
      linked current documents. Identify product areas and architecture systems
      whose canonical current state may need reconciliation after acceptance;
      do not copy that current state into proposal.md.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Behavioral delta specifications for affected capabilities
    template: spec.md
    instruction: |
      Invoke `write-spec` with `postWordingReview: none` to create or
      revise one behavioral delta spec per capability named by proposal.md.
      Treat this change's spec path and the OpenSpec delta structure below as
      the output contract for that workflow; do not write a second
      project-level specification. That workflow must invoke
      `annotate-with-claims` with `claimStage: provisional` before first
      presentation and after each revision. Do not lock claims in this stage.

      Use OpenSpec ADDED, MODIFIED, REMOVED, and RENAMED sections. Every
      requirement uses `### Requirement:` and has at least one testable
      `#### Scenario:` using WHEN and THEN. MODIFIED requirements contain the
      complete replacement block. Specs own observable behavior, not internal
      design, product goals, architecture descriptions, change history, or
      execution steps. Preserve `specs/<capability>/spec.md`; capability
      directory name is stable OpenSpec identity.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical decisions, ownership boundaries, risks, and migration approach
    template: design.md
    instruction: |
      Explain HOW the proposed behavior will be implemented.

      Confirm every bootstrapped implementation language and intended native
      test framework, then verify Veritas has a compatible runnable evidence
      producer. If native evidence support is missing, stop and report the
      unsupported stack plus explicit choices: approve a
      cross-language bridge, add a native producer, change stacks, or defer
      evidence while leaving the workflow blocked. Never select or configure a
      fallback test framework without explicit user approval.

      Record only material architecture decisions, alternatives, ownership
      boundaries, dependency direction, risks, migration, and rollback. Do not
      restate requirements. Any new observable guarantee belongs back in specs.
      Identify accepted product-area and architecture-system documents that
      implementation must reconcile. When change has no architecture delta,
      state that briefly instead of inventing design. Keep temporal rationale
      here; do not create a separate decision log.
      Record the approved language, test framework, evidence producer, and any
      bridge in Tooling Compatibility. Resolve questions that would change
      behavior, architecture, delivery decomposition, or evidence support
      before continuing.
    requires:
      - specs

  - id: plan
    generates: plan.md
    description: In-house durable delivery intent and proof expectations
    instruction: |
      Enter this artifact only through `vspec plan --change <name>` after
      `vspec review` records the current behavioral revision. Drafting must
      leave plan.md absent. VSpec must not create or seed plan.md: it reports
      the destination, and `create-implementation-plan` creates it using a
      right-sized structure. Once present, the plan
      command inspects this durable artifact; `vspec start` only consumes an
      approved result and never creates or revises it.

      Use Veritas itself as the planning-readiness gate. Do not create or
      maintain a separate evidence-readiness artifact.

      Recheck project-bound Veritas access. Prefer active MCP. When unavailable
      or bound elsewhere, permit CLI fallback only after
      `vtas --project <absolute-project-root> status --json` succeeds. Stop only
      when neither path works.

      Require resolved Tooling Compatibility from design.md and a configured
      runnable evidence producer compatible with that decision. Never select a
      substitute framework here.

      Specification authoring owns provisional marker reconciliation. Use
      `annotate-with-claims`, `define-behavioral-tests`, and
      `generate-acceptance-tests` only when the selected proof policy or
      material behavior change needs them. Claim locking, coverage modeling,
      acceptance-test generation, evidence-link review, and evidence approval
      are not universal pre-execution stages.

      Treat Veritas output as authoritative; never transcribe hashes, links,
      approvals, or findings into a second maintained readiness record.
      Optional generated reports are audit output only. A consumer-relevant
      claim that no supported boundary can falsify may remain in the spec with
      a `[[coverage.exclude]]` entry carrying the claim and required `reason`;
      exclusions grant no coverage, proof, or approval.

      Use `create-implementation-plan` to author or revise this change's
      durable plan.md. The skill consumes the reviewed contract, settled
      conversation decisions, repository seams and learnings, current Veritas
      state, and conditional external research. It may draw on its packaged
      light authoring template, but must adapt, combine, reorder, or omit
      sections rather than treating that template as a validation schema. It
      owns the Markdown structure; VSpec requires only a nonempty regular file
      and imposes no frontmatter, checklist, phase-DAG, or runtime-scheduling
      syntax.

      Inspect the result before owner acceptance. Only
      `vspec plan --change <name> --accept` binds acceptance to the exact
      reviewed-contract and plan hashes. Planning findings change OpenSpec
      plan.md, never a projected copy. Gas City performs no planning or plan
      review.

      Do not write a second project-level plan. The plan must consume proposal,
      specs, design, current code seams, and fresh Veritas state. It owns
      stable implementation units, component responsibility, preservation,
      dependencies, risks, evidence transitions, and proof expectations. Its
      structure is methodology-owned; VSpec must not require checkboxes or any
      other progress-marker form. It must preserve Veritas as the completion gate, must
      not pretend an excluded non-falsifiable claim has runnable proof, and must
      not invent behavior or architecture decisions missing from specs or
      design. When accepted scope changes product requirements or architecture,
      include explicit work to update each affected
      `openspec/product/<area>.md` or `openspec/architecture/<system>.md` and
      its README index. Never schedule automatic textual merging. Do not create
      `tasks.md`, `spec-requirements.md`,
      `behavioral-test-requirements.md`, `discovery.md`, or `DECISIONS.md`
      as shadow gates.
    requires:
      - specs
      - design

apply:
  requires: [plan]
  tracks: plan.md
  instruction: |
    Require nonempty plan.md plus current checkout-local owner acceptance
    recorded by `vspec plan --accept` for the exact contract and plan hashes.
    Read the accepted plan, then invoke `autonomous-software-development` for
    implementation.

    Enter execution through `vspec start --change <name>` or
    `vspec start --change <name> --swarm`. Direct execution consumes the
    approved plan without creating phase briefs. Swarm execution continues
    through Gas City `build-from-decompose`; Gas City owns task decomposition,
    readiness, scheduling, assignment, retry, and dynamic reprioritization.
    Follow configured isolation, review, verification, and checkpoint policies.
    Never interpret or mutate plan.md checkboxes or other progress markers.
    Direct execution progress belongs to VSpec run state; swarm progress belongs
    to Gas City.
    Completion requires current Veritas evidence for the chosen proof policy;
    implementation progress itself does not require a separate coverage model
    or acceptance-test-authoring ceremony.

    Veritas evidence determines completion independently from executor progress.
    Missing Veritas capabilities or stale plan inputs stop apply; never degrade
    silently to generic plan-text execution. Before archive,
    require every planned product and architecture reconciliation complete.
    OpenSpec archive owns capability delta promotion and temporal history;
    product and architecture prose changes remain explicit delivery edits, not
    automatic archive merges.
