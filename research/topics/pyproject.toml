[project]
name = "mash-topic-research"
version = "0.1.0"
description = "Offline topic experiments; separate from the Rust application"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scikit-learn>=1.5,<2", "onnxruntime>=1.22,<2", "tokenizers>=0.21,<1", "blake3>=1,<2", "yake==0.7.3"]

[project.optional-dependencies]
graph = ["infomap==2.15.1"]
