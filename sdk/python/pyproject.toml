[project]
name = "mash-sdk"
version = "0.0.1"
description = "Experimental typed building blocks for external Mash connectors"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "orjson>=3.11,<4", "jsonschema>=4.25,<5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["datamodel-code-generator==0.83.0", "ruff==0.15.20", "ty==0.0.38"]

[tool.hatch.build.targets.wheel]
packages = ["src/mash_sdk"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["src/mash_sdk/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
