\* A claim table that overwrites: the second node silently takes the source
\* while the first keeps polling, so both write the same account history.
CONSTANTS
  Sources = {slack_T0123_U0ALICE}
  Nodes = {laptop, server}
  DeviceScope = FALSE
  FirstWriterWins = FALSE

INIT Init
NEXT Next

INVARIANTS
  NoDoubleIngest
