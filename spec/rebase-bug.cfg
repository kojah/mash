\* Two lanes read the head while preparing, so both compute the same next
\* revision. This is the ordering failure four lanes exposed.
CONSTANTS
  Batches = {b1, b2, b3}
  Lanes = 2
  Rebase = FALSE
  Scoped = TRUE
  Entries = {personal_auto, bench_auto}

INIT Init
NEXT Next

INVARIANTS
  OrderedRevisions
