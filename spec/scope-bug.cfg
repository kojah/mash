\* "auto": two destinations register the same key and the second lookup fails.
CONSTANTS
  Batches = {b1}
  Lanes = 1
  Rebase = TRUE
  Scoped = FALSE
  Entries = {personal_auto, bench_auto}

INIT Init
NEXT Next

INVARIANTS
  UniqueBackfillIdentity
