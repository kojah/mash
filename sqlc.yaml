version: "2"
plugins:
  - name: rust
    wasm:
      url: https://github.com/tunamaguro/sqlc-gen-rust/releases/download/v0.1.12/sqlc-gen-rust.wasm
      sha256: f434350fd09a485a3c9e94df4808c2d58f7f817937ed2e0654e9180eb96aa9ff
sql:
  - engine: sqlite
    schema:
      - app/storage/silver.sql
      - app/storage/views.sql
    queries: queries/sqlite/index.sql
    codegen:
      - plugin: rust
        out: app/storage/generated
        options:
          db_crate: rusqlite
          output: queries.rs
  - engine: sqlite
    schema: app/storage/silver.sql
    queries: queries/sqlite/shared.sql
    codegen:
      - plugin: rust
        out: app/shared/silver_store/generated
        options:
          db_crate: rusqlite
          output: queries.rs
